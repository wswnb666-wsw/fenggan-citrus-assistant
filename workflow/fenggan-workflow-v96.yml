          \ elif has_time and e_hit:\n        route, hit = \"trend\", \"趋势·环境读数\"\
          \    # \"这几天温度/湿度怎么样\"→ 趋势，别答此刻\n    elif o_sub and o_ask and not o_block:\n\
          \        route, hit = \"overview\", \"泛问·地里\"\n    elif wa_hit and not money_block:\
          \  # 怎么浇/浇多少/几天浇 → 走知识咨询\n        route, hit = \"water\", \"浇水类\"\n    elif\
