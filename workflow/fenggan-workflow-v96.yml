          \            continue\n        dt = _dt(x.get(\"workTime\"))\n        try:\n\
          \            iv = int(float(x.get(\"safetyInterval\")))\n        except\
          \ Exception:\n            iv = None\n        if dt is None:\n          \
          \  broken = broken or (\"%s 那条用药记录的施药日期无法识别\" % (x.get(\"pesticideName\"\
          ) or \"该药\"))\n        if iv is None or iv <= 0 or iv > 365:\n         \
          \   broken = broken or (\"%s 那条用药记录的安全间隔期缺失或非法\" % (x.get(\"pesticideName\"\
          ) or \"该药\"))\n        if dt is None or iv is None or iv <= 0 or iv > 365:\n\
