          \    \"    ❌ 这些变体一样禁止：可以补防 / 可以安排用药 / 可安排傍晚用药 / 建议补打 / 抓紧打 /\",\n      \
          \     \"       尽快打 / 赶紧打 / 及时用药 / 该打药了 / 直接补防 / 不用再观察 / 现在就打 / 及早防治 /\"\
          ,\n           \"       发现虫就打 / 确认后就可以用药 / 适合打药 / 适合喷药 / 天气允许喷药 / 天气条件允许\
          \ /\",\n           \"       条件允许就打 / 可以喷 / 可以打 / 时机合适 / 该防了 / 抓紧防治 / 及时防治。\"\
          ,\n           \"       换词不算，意思一样就不许写。\",\n           \"\U0001F534 insufficient\
          \ / invalid 时整条回答最多 3 句：第 1 句照抄上面的口径，后面最多补 1~2 句纯「事实」\",\n           \"\
          \   （读数 / 记录时间 / 最近一次用药日期）。凡涉及「打 / 补 / 防 / 用药 / 喷」的动作建议一个字都不许写，\",\n   \
          \        \"   这件事由农户自己决定。\",\n           \"\U0001F534 也不许换着法子给「用药安排」——以下句式一律禁止：建议间隔期过后补防\
          \ / 建议立即补防 /\",\n           \"   可以准备铜制剂 / 可以轮换使用 / 建议先备药 / 等间隔期满了就安排用药\
          \ / 该安排防治了。\",\n           \"   ⚠️ 尤其注意：即使 target_pest 是从上一轮继承来的、你自认为对象没错，\"\
          ,\n           \"   只要 decision_level 不是 strong，任何形式的用药安排 / 备药 / 轮换建议都不许出现。\"\
          ,\n           \"\U0001F534 本轮问的病虫就是上面 target_pest；不许拿别的病虫（含历史记录里的其它病虫）的数据来论证它。\"\
          ]\n    if src == \"继承\":\n        buf.append(\"\U0001F534 本轮用户没点名病虫，只用「那个/它」指代；target_pest\
          \ 是从上一轮上下文继承的。\"\n                   \"如果农户其实在说别的病虫，他会纠正你 —— 你不要自己再换对象，也不要替他猜第二个。\"\
          )\n    elif src == \"本轮\":\n        buf.append(\"\U0001F534 target_pest\
          \ 就是农户本轮自己说的病虫名，不许改成别的。\")\n    return \"\\n\".join(buf)\n\n\n# ============================================================================\n\
          # \U0001F534 v92（v91 同分句补测 · 任务单）：**两线判据**，修\"同分句知识词屏蔽执行决策\"。\n#   v91 的问题：分句内只要出现\"\
          特征/识别/怎么\"等知识词就一票否决 ——\n#   「红蜘蛛有哪些特征以及现在能否施药？」这类**同分句混合意图**会被整体屏蔽（实测 A04/A05/A07\
          \ 失败）。\n#   v92 判据（逐分句）：\n#     ① 强决策信号：_A（明确决策词）+ _V（执行动作）→ **判为执行决策，不看知识词**\n\
          #        （任务单 §六.2：同分句兼有知识标记与明确执行问法时，优先识别执行决策）；\n#     ② 弱决策信号：_B（可以/能/需要/该/要）+\
          \ _V，且（含 _T 当前时间语 或 不含 _FRAME 知识框架语）→ 判为执行决策；\n#     ③ 其余 → 知识/一般问题，保持原路径。\n\
          #   边界（实测）：\n#     ·「红蜘蛛现在暂时不要打药，对吗？」→ ②（要+打药+现在）✓ 判决策；\n#     ·「红蜘蛛什么时候需要防治？」→\
          \ ② 无当前时间语且有\"什么时候\"框架语 → **不判决策** ✓；\n#     ·「如果以后发现红蜘蛛，一般该怎么防治？」→ ② 有\"\
          如果/以后/一般/怎么\" → 不判决策 ✓；\n#     · 纯知识「红蜘蛛怎么防治／用什么药／有哪些措施／发生规律／安全间隔期」→ ① ②\
          \ 都不命中 → 不判决策 ✓。\n#   ⚠️ 只改识别覆盖面，**不动**任何阈值/窗口/门槛/失败关闭规则。\n# ============================================================================\n\
          _A_WORDS = (\"要不要|该不该|需不需要|用不用|打不打|能不能|能否|是否|适不适合|适合\"\n            \"|可不可以|可以不可以|是否可以\"\
          )\n_B_WORDS = \"可以|能|需要|该|要\"\n_V_WORDS = \"防治|防控|用药|施药|打药|喷药|喷施|喷雾|打一遍|喷一遍|处理|治|防|打\"\
          \n_T_WORDS = \"现在|今天|当前|马上|立刻|直接|先\"\n_FRAME_WORDS = (\"怎么|如何|哪些|哪种|有什么|什么|介绍|讲讲|发生规律|危害|特征|症状|识别|区别\"\
          \n                \"|多久|间隔期|安全间隔|稀释|倍数|什么时候|何时|以后|未来|一般|通常|如果|假如|为什么\")\n\
          _A_RE = _re.compile(r\"(%s)[^。？！；;，,\\n]{0,6}(%s)\" % (_A_WORDS, _V_WORDS))\n\
          _B_RE = _re.compile(r\"(%s)[^。？！；;，,\\n]{0,6}(%s)\" % (_B_WORDS, _V_WORDS))\n\
          _T_RE = _re.compile(_T_WORDS)\n_FRAME_RE = _re.compile(_FRAME_WORDS)\n\n\
          \ndef _is_decide_text(s) -> str:\n    \"\"\"分句级两线判据：返回命中的分句（空串 = 不是执行决策）。\"\
          \"\"\n    for _c in _re.split(r\"[。？！；;，,\\n]\", str(s or \"\")):\n    \
          \    _c = _c.strip()\n        if not _c:\n            continue\n       \
          \ if _A_RE.search(_c):                      # ① 强信号：不看知识词\n            return\
          \ _c\n        if _B_RE.search(_c):                      # ② 弱信号：需当前时间语，或无知识框架语\n\
          \            if _T_RE.search(_c) or not _FRAME_RE.search(_c):\n        \
          \        return _c\n    return \"\"\n"
