          \                                               x.get(\"safetyInterval\"\
          )))\n    if rows:\n        out.append(\"   最近用药：\" + \"；\".join(rows))\n\
          \    out.append(_safety(d, base))\n    return \"\\n\".join(out)\n\n\ndef\
          \ main(today, kb_use, kb_know, pest_json, med_json, sens_json, farm_json,\n\
          \         pheno_json, yld_json, sales_json) -> dict:\n    base = _base(today)\n\
          \    parts = [\"【本园实时 / 记录数据（已由系统整理，只许用这里有的；今天是 %s）】\"\n             % base.strftime(\"\
