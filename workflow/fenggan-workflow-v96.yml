          \      gs = (\"本园已记录到「%s」的实时虫情，但%s，现在不能安排用药；\"\n                  \"先巡查确认虫情，再决定是否用药。\"\
          ) % (_gt or \"该病虫\", _kbwhy)\n    if gs and lv and lv != \"strong\":\n \
          \       t = t.strip()\n        if gs in t and not t.startswith(gs):\n  \
          \          t = t.replace(gs, \"\", 1).strip()          # 出现在中间 → 挪到最前面，不重复\n\
          \        if not t.startswith(gs):\n            t = (gs + \"\\n\" + t).strip()\
          \ if t else gs\n        # \U0001F534 执行级句子删除（v80）：口径句之后的正文里，\"建议/可以/适合…打(喷/用)药\"\
          、\n        #    \"补防/轮换/备药/安排用药\"、\"可以/建议…再打\"这类**执行级结论**整句删掉。\n       \
          \ #    提示词压不住（实测 4 处漏水），只能代码删；条件式说法（是否用药/要不要/\n        #    需不需要/先巡查确认）保留，硬词（补防/轮换/备药）无条件删。\n\
          \        _rest = t[len(gs):].strip()\n        if _rest:\n            _parts\
          \ = [s for s in re.split(r\"(?<=[。！？；\\n])\", _rest) if s.strip()]\n   \
          \         _keep = []\n            for _s in _parts:\n                # \U0001F534\
          \ v85 P0-2：先按转折词切成子句，**逐子句独立判定** ——\n                #    否则\"不能用药，但明天可以安排防治\"\
          这种会被前半句的否定词整体放行。\n                _subs = _TURN.split(_s)\n            \
          \    _kept = []\n                _ctx_inspect = False   # \U0001F534 v86\
          \ P1-4：本句前面是否出现过\"先巡查/先确认\"这类核实动作\n                for _c in _subs:\n  \
          \                  if not _c.strip():\n                        continue\n\
          \                    # \U0001F534 v81 T2 + v86 P1-4：把\"具体执行动作安排到未来\"删掉；但\n\
          \                    #    \"先巡查确认…再决定是否用药\"这种**先核实后决定**的安全条件式必须保留\n    \
          \                #    （后半句自己不带核实词时，看本句前面有没有出现过核实动作）。\n                 \
          \   _safe_cond = ((_INSPECT.search(_c) or _ctx_inspect)\n              \
          \                    and _DECIDE_FORM.search(_c)\n                     \
          \             and not _DIRECT_EXEC.search(_c))\n                    if (_ASK.search(_c)\
