        code: "import re\n_ALIAS = {\"介壳虫\": \"蚧壳虫\", \"沙皮病\": \"砂皮病\", \"锈蜘蛛\": \"\
          锈壁虱\", \"柑橘木虱\": \"木虱\"}\n# \U0001F534 v87 R6：KB\"有效支持\"必须同时满足：① 含目标病虫名\
