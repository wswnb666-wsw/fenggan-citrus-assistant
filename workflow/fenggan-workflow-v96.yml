          # ============================================================================\n\
          # \U0001F534 v96（复审 P0）：两线判据 + **动作前置模式** + 知识框架否决。修两处实测缺陷：\n#   ①「红蜘蛛施药是否合适？」→\
          \ 旧版漏判（识别只覆盖\"决策词在前、动作在后\"）；\n#   ②「红蜘蛛应该怎么防治？」→ 旧版误判（\"该 + 防治\" 命中，但这是纯知识问句）。\n\
          _A_WORDS = (\"要不要|该不该|需不需要|用不用|打不打|能不能|能否|是不是|是否|适不适合|适合\"\n           \
