    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"浇水建议强度（确定性 Code 节点）：water_advice_level\
          \ = strong / cautious / invalid。\n\U0001F534 土壤湿度是**绝对含水率**，不能套 60%~80%\
          \ 相对含水量标准；\n   只有「数据可靠 + 同探头趋势走低 + 三点一致 + 无明显异常」才允许给\"建议适当补水\"。\n2026-09-28\
          \ 补丁：农户自己提出的两个\"前提\"必须被尊重 ——\n   ①「读数长期不更新/一直不变」→ 不许照着读数给执行级建议，先确认探头；\n\
          \   ②「明天要下雨」→ 不许说\"赶紧浇\"，结合预报降到 cautious。\n\"\"\"\nimport json\nimport re\n\
          from datetime import datetime, timedelta, timezone\n\n_NOW = (datetime.now(timezone.utc)\
          \ + timedelta(hours=8)).replace(tzinfo=None)\nFRESH_H = 24          # 读数超过这么多小时没更新\
          \ → 判为\"长期不更新\"\nPTS = (\"湿度1\", \"湿度2\", \"湿度3\")\nNAME_CN = {\"湿度1\":\
          \ \"1号点\", \"湿度2\": \"2号点\", \"湿度3\": \"3号点\"}\n\n# 农户自己说出来的\"设备可疑\"前提\n\
          PREM_DEVICE = [\"长期不更新\", \"一直不更新\", \"很久没更新\", \"老是不更新\", \"没更新\", \"不更新\"\
          ,\n               \"一直不变\", \"老不变\", \"没变过\", \"一动不动\", \"卡住\", \"坏了吗\"\
          , \"是不是坏\",\n               \"是不是故障\", \"是不是不准\", \"校准\", \"不准了\", \"常年不变\"\
          , \"总是这个数\"]\n# 农户自己说出来的\"要下雨\"前提\nPREM_RAIN = [\"下雨\", \"有雨\", \"降雨\",\
          \ \"雨水\", \"要下雨\", \"下大雨\", \"雨天气\"]\n\n_EMPTY = {\"text\": \"\", \"water_advice_level\"\
          : \"\", \"soil_water_valid\": \"false\",\n          \"trend_support\": \"\
          false\", \"cross_point_support\": \"false\", \"device_abnormal\": \"false\"\
          }\n\n\ndef _o(s):\n    try:\n        x = json.loads(s) if isinstance(s,\
          \ str) else s\n    except Exception:\n        return {}\n    return x if\
          \ isinstance(x, dict) else {}\n\n\ndef _f(v):\n    try:\n        return\
          \ float(v)\n    except Exception:\n        return None\n\n\ndef _dt(s):\n\
          \    for f in (\"%Y-%m-%d %H:%M:%S\", \"%Y-%m-%d\"):\n        try:\n   \
          \         return datetime.strptime(str(s or \"\")[:19], f)\n        except\
          \ Exception:\n            continue\n    return None\n\n\ndef _rain(wx):\n\
          \    \"\"\"天气文本里出现 >=50% 的降雨概率 → 提示先看雨情。\"\"\"\n    try:\n        ns = [int(x)\
          \ for x in re.findall(r\"降雨概率\\s*[:：]?\\s*(\\d+)\\s*%\", str(wx or \"\"\
          ))]\n    except Exception:\n        return False\n    return bool([n for\
          \ n in ns if n >= 50])\n\n\ndef _rain_fact(wx):\n    \"\"\"从天气文本里挑出\"明天/后天\"\
          的降雨概率，作为可引用的事实。\"\"\"\n    w = str(wx or \"\")\n    out = []\n    for tag\
          \ in (\"明天\", \"后天\"):\n        for m in re.finditer(r\"降雨概率\\s*[:：]?\\\
          s*(\\d+)\\s*%\", w):\n            n = int(m.group(1))\n            # 只取该标签之后\
          \ 40 个字符内的概率，避免张冠李戴\n            seg = w[max(0, m.start() - 40):m.end()]\n\
          \            if tag in seg:\n                out.append(\"%s降雨概率 %d%%\"\
          \ % (tag, n))\n                break\n    return \"、\".join(out)\n\n\ndef\
          \ main(route, question, sens_json, stat_json, wx, raw) -> dict:\n    # 只在\"\
          浇水类\"这条路上输出口径（本条链路上还有症状/技术两类问题）\n    if str(route or \"\") != \"water\"\
          :\n        return dict(_EMPTY)\n\n    rq = str(raw or \"\").strip()\n  \
          \  sj = _o(sens_json)\n    sdata = sj.get(\"data\") if str(sj.get(\"code\"\
          )) == \"200\" else None\n\n    # \U0001F534 v87 R4：① 同点位取**时间戳最新**那条（不依赖接口返回顺序）；\n\
          \    #           ② 逐点位记录时间戳状态（缺 / 无法解析 / 未来 / 过期）——任一参与点位异常都不许 strong。\n\
          \    latest, ages, ts_bad = {}, {}, {}\n    if isinstance(sdata, list):\n\
          \        for x in sdata:\n            if not isinstance(x, dict):\n    \
          \            continue\n            nm = str(x.get(\"digitalName\") or \"\
          \")\n            if nm not in PTS:\n                continue\n         \
          \   old = latest.get(nm)\n            if old is None:\n                latest[nm]\
          \ = x\n                continue\n            if _dt(x.get(\"recordTime\"\
          )) is None:\n                continue\n            if _dt(old.get(\"recordTime\"\
          )) is None or _dt(x.get(\"recordTime\")) >= _dt(old.get(\"recordTime\")):\n\
          \                latest[nm] = x\n    for nm, x in latest.items():\n    \
          \    v = _f(x.get(\"digital\"))\n        if v is None:\n            continue\n\
          \        dt = _dt(x.get(\"recordTime\"))\n        if dt is None:\n     \
          \       ts_bad[nm] = \"时间戳缺失或无法解析\"\n            ages[nm] = None\n     \
          \       continue\n        _hrs = (_NOW - dt).total_seconds() / 3600.0\n\
          \        if _hrs < 0:\n            ts_bad[nm] = \"时间戳在未来\"\n           \
          \ ages[nm] = None\n            continue\n        ages[nm] = round(_hrs,\
          \ 1)\n        if _hrs > FRESH_H:\n            ts_bad[nm] = \"读数超过 %d 小时没更新\"\
          \ % FRESH_H\n\n    vals = {nm: _f(x.get(\"digital\")) for nm, x in latest.items()}\n\
          \    vals = {k: v for k, v in vals.items() if v is not None}\n    same =\
          \ len(vals) >= 3 and len(set(vals.values())) == 1\n    allzero = bool(vals)\
          \ and all(v == 0 for v in vals.values())\n    anyzero = bool(vals) and any(v\
          \ == 0 for v in vals.values())\n    stale = bool(ages) and all((a is None\
          \ or a > FRESH_H) for a in ages.values())\n    # \U0001F534 v87 R4：参与判定（有读数）的点位必须**每一个**都有可用时间戳，才允许\
          \ strong\n    ts_ok = bool(vals) and all(nm not in ts_bad for nm in vals)\n\
          \n    abnormal = (not vals) or allzero or same or stale\n\n    # ---- 趋势：同探头自身\
          \ 7 天基线 ----\n    # \U0001F534 同一 digitalName 在统计里会混进多台设备（GDZS26042571~4），必须按\
          \ deviceNum 对齐到\n    #    \"快照里那个探头\"，否则会拿另一台设备的序列去比，趋势判断直接失效（实测踩过）。\n \
          \   dev_of = {nm: str(x.get(\"deviceNum\") or \"\") for nm, x in latest.items()}\n\
          \    tj = _o(stat_json)\n    tdata = tj.get(\"data\") if str(tj.get(\"code\"\
          )) == \"200\" else None\n    series = {}\n    if isinstance(tdata, list):\n\
          \        best = {}\n        for x in tdata:\n            if not isinstance(x,\
          \ dict):\n                continue\n            nm = str(x.get(\"digitalName\"\
          ) or \"\")\n            if nm not in PTS:\n                continue\n  \
          \          dev = str(x.get(\"deviceNum\") or \"\")\n            if dev_of.get(nm)\
          \ and dev and dev != dev_of[nm]:\n                continue\n           \
          \ day = str(x.get(\"day\") or \"\")[:10]\n            a = _f(x.get(\"avgV\"\
          ))\n            if not day or a is None:\n                continue\n   \
          \         try:\n                c = int(float(x.get(\"cnt\") or 0))\n  \
          \          except Exception:\n                c = 0\n            k = (nm,\
          \ day)\n            if k not in best or c > best[k][1]:\n              \
          \  best[k] = (a, c)\n        for (nm, day), (a, _c) in best.items():\n \
          \           series.setdefault(nm, {})[day] = a\n\n    below = {}\n    for\
          \ nm, day_map in series.items():\n        if len(day_map) < 3 or nm not\
          \ in vals:\n            continue\n        base = sum(day_map.values()) /\
          \ float(len(day_map))\n        if vals[nm] < base:\n            below[nm]\
          \ = (vals[nm], round(base, 2))\n\n    trend_support = len(below) >= 3\n\
          \    cross_ok = (len(vals) >= 3 and not same and not anyzero)\n    valid\
          \ = bool(vals) and not abnormal\n    cross_point_support = bool(cross_ok\
          \ and trend_support)\n\n    if abnormal:\n        level = \"invalid\"\n\
          \        sen = \"当前这组数据不能作为浇水依据，先检查探头。\"\n    elif valid and trend_support\
          \ and cross_point_support and ts_ok:\n        level = \"strong\"\n     \
          \   sen = (\"三个点位今天的绝对含水率读数都低于各自最近一周的均值（今天 %s），\"\n               \"数据本身看不出异常；建议适当补水，具体水量按上面的知识库口径来。\"\
          ) % _fmt(vals)\n    elif valid and trend_support and cross_point_support\
          \ and not ts_ok:\n        # \U0001F534 v87 R4：趋势与点位对照都满足，但**有参与点位的时间戳异常**\
          \ ⇒ 不能给强建议\n        level = \"cautious\"\n        sen = (\"这组土壤湿度读数里有 %d\
          \ 个点位的时间戳异常（%s），不能作为强建议依据；\"\n               \"先核实读数时间或现场看墒情，再决定要不要补水。\"\
          ) % (\n            len(ts_bad), \"、\".join(sorted(set(ts_bad.values()))))\n\
          \    else:\n        level = \"cautious\"\n        sen = (\"当前读数偏低（今天 %s），但这是**绝对含水率**，不能直接套\
          \ 60%%~80%% 那种相对含水量标准；\"\n               \"建议先结合田间实际情况确认，再决定要不要补水。\") %\
          \ _fmt(vals)\n\n    # ---- \U0001F534 农户自己提出的前提（设备可疑 / 要下雨）：必须尊重，不许照读数给执行级建议\
          \ ----\n    fresh_txt = _fresh_txt(latest)\n    prem_dev = any(w in rq for\
          \ w in PREM_DEVICE)\n    prem_rain = (any(w in rq for w in (\"明天\", \"后天\"\
          , \"接下来\", \"这两天\"))\n                 and any(w in rq for w in PREM_RAIN))\n\
          \    if prem_dev and level != \"invalid\":\n        level = \"cautious\"\
          \n        sen = (\"你提到土壤湿度读数长期不更新：我这边看到的最新读数还在正常上报（%s），\"\n            \
          \   \"如果设备屏幕上一直不动，先确认探头是不是正常（可以现场看一下或校准），\"\n               \"确认之前先别只按这个读数决定浇不浇。\"\
          ) % fresh_txt\n    elif prem_rain and level != \"invalid\":\n        rf\
          \ = _rain_fact(wx)\n        fact = (\"预报里%s，\" % rf) if rf else \"我这边看不到明天以后的逐时降雨数据，建议先看手机天气预报，\"\
          \n        level = \"cautious\"\n        sen = (\"你说明天有雨：%s今天先别急着补水，结合田间实际情况确认（抓一把土看看），\"\
          \n               \"真下透了就可以推迟；如果雨没下来，再按读数决定。\") % fact\n\n    notes = []\n\
          \    if level == \"invalid\":\n        if not vals:\n            notes.append(\"\
          这次没取到土壤湿度读数\")\n        if allzero:\n            notes.append(\"三点读数全为 0（疑似没测到\
          \ / 通信异常）\")\n        if same:\n            notes.append(\"三点读数完全相同（疑似没测到）\"\
          )\n        if stale:\n            notes.append(\"读数超过 %d 小时没更新\" % FRESH_H)\n\
          \    else:\n        if anyzero:\n            notes.append(\"有个别点位读数为 0，已按疑似没测到处理\"\
          )\n        if len(vals) < 3:\n            notes.append(\"只有 %d 个点位有读数，点位对照不足\"\
          \ % len(vals))\n        if not trend_support:\n            notes.append(\"\
          缺少可用的同探头多日趋势\" if not series else \"同探头趋势不支持读数在走低\")\n        if prem_dev:\n\
          \            notes.append(\"农户本人提到读数长期不更新（本机看到最新读数时间：%s）\" % fresh_txt)\n\
          \        if prem_rain:\n            notes.append(\"农户本人说明天有雨%s\" % ((\"\
          （预报：\" + _rain_fact(wx) + \"）\") if _rain_fact(wx) else \"（本机没有明天的逐时降雨数据）\"\
          ))\n    # \U0001F534 v87 R5：降雨与建议口径必须一致 —— 高降雨概率时**同步降级 level 并改口径**，\n\
          \    #    不能再出现\"strong 直接建议补水 + 同时说先看雨情\"的自相矛盾（阈值 50% 保持不变）。\n    if _rain(wx)\
          \ and not prem_rain:\n        if level == \"strong\":\n            level\
          \ = \"cautious\"\n            _rf = _rain_fact(wx)\n            sen = (\"\
          先说雨情：%s今天先别急着补水，结合田间实际（抓把土看看）确认；\"\n                   \"真下透了就可以推迟，如果雨没下来，再按读数决定。\"\
          ) % (\n                (\"预报里%s；\" % _rf) if _rf else \"我这边看不到明天以后的逐时降雨数据，建议先看手机天气预报；\"\
          )\n        notes.append(\"天气里有较高的降雨概率（阈值 50%%），已按'先看雨情'降级，不能直接建议补水\")\n\n\
          \    buf = [\"【\U0001F534 浇水建议强度门（系统已按硬证据判好；这一块是你做结论的唯一依据）】\",\n       \
          \    \"water_advice_level=%s   soil_water_valid=%s  trend_support=%s  \"\
          \n           \"cross_point_support=%s  device_abnormal=%s\" % (\n      \
          \         level, \"true\" if valid else \"false\", \"true\" if trend_support\
          \ else \"false\",\n               \"true\" if cross_point_support else \"\
          false\", \"true\" if abnormal else \"false\"),\n           \"浇水口径（你的回答第一句必须原样照抄这一句）：%s\"\
          \ % sen,\n           \"\U0001F534 严禁把结论升级成「赶紧浇水 / 必须浇水 / 马上补水」——\"\n   \
          \        \"level=strong 只能说「建议适当补水」，level=cautious 只能说「先结合田间实际确认」，\"\n \
          \          \"level=invalid 只能说「先检查探头」，一个字都不许给浇水执行建议。\",\n           \"\U0001F534\
          \ 不许把「绝对含水率读数低」直接说成「设备坏了」，也不许换算成相对含水量。\"]\n    if notes:\n        buf.append(\"\
          补充事实（可引用，别改成结论）：\" + \"；\".join(notes))\n    return {\"text\": \"\\n\".join(buf),\
          \ \"water_advice_level\": level,\n            \"soil_water_valid\": \"true\"\
          \ if valid else \"false\",\n            \"trend_support\": \"true\" if trend_support\
          \ else \"false\",\n            \"cross_point_support\": \"true\" if cross_point_support\
          \ else \"false\",\n            \"device_abnormal\": \"true\" if abnormal\
          \ else \"false\"}\n\n\ndef _fresh_txt(latest):\n    ts = [str((x or {}).get(\"\
          recordTime\") or \"\")[:16] for x in latest.values()]\n    ts = [t for t\
          \ in ts if t]\n    if not ts:\n        return \"没有读数时间\"\n    return max(ts)\n\
          \n\ndef _fmt(vals):\n    return \"、\".join(\"%s %s%%\" % (NAME_CN.get(k,\
          \ k), vals[k]) for k in sorted(vals.keys()))\n"
