          \ + safety_eligible，三者缺一不可）\n    #   \U0001F534 v82 P0-1：用药记录接口**没拿到 / 结构不对**时，绝不能默认\"\
          安全间隔合格\"\n    #      ⇒ 直接判为\"不可确认\"，不许进 strong（这是安全门，不能靠乐观默认）。\n    #  \
          \    结构不对包含：非 200 / data 不是对象 / data 里没有 list 数组。\n    med_data_ok = bool(m_ok\
