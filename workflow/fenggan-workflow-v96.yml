    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"整理天气：把 /ai/data/weather 的 JSON 压成一段人话（今天剩余时段\
          \ / 明天 分组）。\"\"\"\nimport json\nfrom datetime import datetime, timedelta,\
          \ timezone\n\n\ndef main(body: str) -> dict:\n    try:\n        j = json.loads(body)\
          \ if isinstance(body, str) else (body or {})\n    except Exception:\n  \
          \      j = {}\n    if not isinstance(j, dict) or j.get(\"code\") != 200\
          \ or not isinstance(j.get(\"data\"), dict):\n        return {\"text\": \"\
          \"}\n\n    d = j[\"data\"]\n    now = d.get(\"now\") or {}\n    today =\
          \ d.get(\"today\") or {}\n    hours = d.get(\"hours\") or []\n    hints\
          \ = d.get(\"hints\") or []\n\n    cn = datetime.now(timezone.utc) + timedelta(hours=8)\n\
          \    td = cn.strftime(\"%Y-%m-%d\")\n    tm = (cn + timedelta(days=1)).strftime(\"\
          %Y-%m-%d\")\n\n    L = []\n    head = \"%s（%s）｜数据时刻 %s｜来源 %s\" % (\n   \
          \     d.get(\"base\") or \"?\", d.get(\"city\") or \"?\", d.get(\"updatedAt\"\
          ) or \"?\", d.get(\"source\") or \"?\")\n    if d.get(\"stale\"):\n    \
          \    head += \"｜\\u26a0\\ufe0f 这是回退的旧数据（stale），可能稍有延迟，引用时要说明\"\n    L.append(head)\n\
          \n    if now:\n        L.append(\"此刻：%s %s℃，湿度 %s%%，%s%s，降水 %smm\" % (\n\
          \            now.get(\"text\") or \"\", now.get(\"temp\", \"\"), now.get(\"\
          humidity\", \"\"),\n            now.get(\"windDir\") or \"\", now.get(\"\
          windLevel\") or \"\", now.get(\"precip\", \"\")))\n\n    if today:\n   \
          \     L.append(\"今天（%s）：%s，%s~%s℃，降雨概率 %s%%，雨量 %smm\" % (\n            today.get(\"\
          date\") or td, today.get(\"text\") or \"\", today.get(\"low\", \"\"),\n\
          \            today.get(\"high\", \"\"), today.get(\"rainProb\", \"\"), today.get(\"\
          rainMm\", \"\")))\n\n    g = {}\n    order = []\n    for h in hours:\n \
          \       k = str(h.get(\"date\") or \"?\")\n        if k not in g:\n    \
          \        g[k] = []\n            order.append(k)\n        g[k].append(h)\n\
          \n    for date in order:\n        seg = \"｜\".join(\"%s %s℃ 雨%s%%\" % (h.get(\"\
          time\") or \"\", h.get(\"temp\", \"\"), h.get(\"rainProb\", \"\"))\n   \
          \                     for h in g[date])\n        if date == td:\n      \
          \      lab = \"今天剩余时段\"\n        elif date == tm:\n            lab = \"\
          明天\"\n        elif date > td:\n            lab = \"后天\"\n        else:\n\
          \            lab = \"已过去\"\n        L.append(\"%s（%s）：%s\" % (lab, date,\
          \ seg))\n\n    n_tm = len(g.get(tm, []))\n    if n_tm == 0:\n        L.append(\"\
          ⚠️ 本系统看不到「明天」的逐小时数据；被问到时**绝不许拿上面「今天」那一行当成明天**，\"\n                 \"只能说“明天的天气我这边看不到，建议看手机预报”。\"\
          )\n    elif n_tm <= 3:\n        L.append(\"⚠️ 「明天」只覆盖到 %s（共 %d 个整点），明天白天的数据本系统看不到；\"\
          \n                 \"被问到时**只能引用「明天」这一行里真实存在的整点**，\"\n                 \"\
          **绝不许把上面「今天」那一行的降雨概率 / 雨量 / 气温当成明天**；\"\n                 \"没覆盖到的时段就说“那一段我这边看不到，建议看手机预报”。\"\
          \n                 % ((g.get(tm) or [{}])[-1].get(\"time\") or \"\", n_tm))\n\
          \n    if hints:\n        L.append(\"机械判据：%s\" % \"；\".join(str(x) for x\
          \ in hints))\n\n    L.append(\"说明：逐小时只覆盖未来约 12 小时（跨零点后会标成「明天」）；以上为自动整理，仍以田间实际情况为准。\"\
          )\n    return {\"text\": \"\\n\".join(L)}\n"
