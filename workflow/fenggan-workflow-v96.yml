          : str(x[\"content\"]).strip()[:200],\n            \"type\": str(x.get(\"\
          type\") or \"fact\")[:20]} for x in arr[:2]]\n    return {\"memories_json\"\
          : json.dumps(out, ensure_ascii=False), \"count\": str(len(out))}\n"
