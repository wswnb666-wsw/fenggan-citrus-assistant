          (?<=[，,；;])|(?<!不)(?=但|不过|然而|只是|另外|却|可是|反而|同时)\")\n_CONCESS2 = _re2.compile(r\"\
          ^(虽然|尽管|即使|就算)\")\n_DANGLING = (\"但是\", \"可是\", \"反而\", \"同时\", \"不过\",\
          \ \"然而\", \"只是\", \"另外\", \"却\", \"而且\", \"并且\")\n\nIMG_GATE_SENT = (\"\
          仅凭这张图片不能确认本园当前虫情是否达到用药条件，请先核实现场虫情，\"\n                 \"再依据有效记录、农药标签和安全间隔期判断是否需要用药。\"\
          )\nIMG_SAFE_FALLBACK = \"建议先核实现场虫情，再结合有效记录、农药标签和安全间隔期判断是否需要用药。\"\n\n\ndef\
          \ _is_decide_q2(q):\n    \"\"\"分句级三线判据：一线/二线命中即判决策（不看知识词）；三线需当前语境或不含知识框架词。\n\
          \    raw 缺失/为空 → 保守：按执行决策处理（不得因缺原话放行执行建议）。\"\"\"\n    s = str(q or \"\"\
          )\n    if not s.strip():\n        return True\n    for c in _re2.split(r\"\
          [。？！；;，,\\n]\", s):\n        c = c.strip()\n        if not c:\n        \
          \    continue\n        if _A_RE.search(c) or _REV_RE.search(c):\n      \
          \      return True\n        if _B_RE.search(c) and (_T_RE2.search(c) or\
          \ not _FRAME_RE2.search(c)):\n            return True\n    return False\n\
          \n\ndef _img_gate(t, raw):\n    \"\"\"执行决策场景 → 安全口径句置顶 + 收窄豁免的逐子句过滤 + 残句收口。\n\
          \    返回 (新文本, 是否决策)。\"\"\"\n    if not _is_decide_q2(raw):\n        return\
          \ t, \"0\"\n    t = str(t or \"\").strip()\n    if not t:\n        return\
          \ IMG_GATE_SENT, \"1\"\n    if not t.startswith(IMG_GATE_SENT):\n      \
          \  t = (IMG_GATE_SENT + \"\\n\" + t).strip()\n    rest = t[len(IMG_GATE_SENT):].strip()\n\
          \    if not rest:\n        return IMG_GATE_SENT, \"1\"\n    kept_sents =\
          \ []\n    for s in [x for x in _re2.split(r\"(?<=[。！？；\\n])\", rest) if\
