    - data:
        classes:
        - id: '1'
          label: 实时环境数据
          name: 问**此刻**（现在、今天）地里的读数，以及要不要现在动手：现在的土壤温湿度、氮磷钾、pH、气温、光照是多少，现在地干不干、要不要浇水/灌水/排水。**只回答「此时此刻」的数值。**⚠️
            句子里出现「昨天/前天/上周/前几天/最近三天/最近一周/过去」这类**过去时间**的，属于第 2 类，不要选本类；问「今天/接下来要做什么农活、有什么活要干」这类**农活安排**的，属于第
            3 类，不要选本类。
        - id: '2'
          label: 历史趋势查询
          name: 问**过去一段时间**的变化：昨天、前天、上周、前几天、过去几天、最近三天、最近一周、最近一个月的温湿度或气象变化，比之前升了还是降了。**只要涉及过去、变化、趋势，或带有「昨天/前天/上周/前几天/最近N天」这类时间词，就是本类**（哪怕问的是「地里怎么样」，只要加了时间词就是本类）。
        - id: '1789201530269'
          label: 农事记录
          name: 问**农活台账与农活安排**：做过哪些农活、施过什么肥、修剪除草灌溉几次、一共干过多少次活、最近干了什么；**以及今天/接下来要做什么农活、有哪些活要干、农事怎么安排、这个月该干啥**。只要句子里有「农事」「农活」「活」并且在问「要干什么/干了什么」，就是本类。只汇报台账与计划，不给方法建议。⚠️
            如果问的是打药用药（打了几次药、用了什么药、间隔多久），那是第 9 类，不要选本类。
        - id: '1789201530840'
          label: 病虫害记录
          name: 问本园**记录过**的病虫害：发生过哪些病虫、什么时候发生、哪块地、处理了没有、受害面积多少平方米。只讲已经发生的记录，不教怎么防治。
        - id: '1789201531411'
          label: 产量查询
          name: 问果子的**收成数量**：今年产量多少斤/多少公斤、亩产多少、各品种各区块产量对比、产量记录。只答重量数字，不答金额。
        - id: '1789201531986'
          label: 农事知识咨询
          name: 问**种植技术和方法**：怎么种、怎么防病治虫、怎么施肥修剪、怎么浇水（浇多少水、几天浇一次）、果子出现异常症状是什么原因怎么处理。回答通用的方法与原因，不是本园的具体数据。
        - id: '1789208237477'
          label: 基地与设备信息
          name: 问**基地规模或设备清单**：基地有几块、总面积多少亩、在什么位置，有几台设备、什么类型、装在哪、是否在线。
        - id: '1789208238084'
          label: 其他或表述不清
          name: 与柑橘种植、本基地的数据/设备/农事都无关的问题；或太笼统无法判断，例如"有没有问题""帮我看看""在吗"。只有确实不属于其他任何一类时才选它。
        - id: '1789220382192'
          label: 用药方案
          name: 问**打药用药**的事：打过几次药、用过哪些药、上次打的什么药、稀释多少倍、打完后多久能采果（安全间隔期）、这个药能不能在柑橘上用。既包括用药记录统计，也包括用药安全规则。
        - id: '1789220382755'
          label: 果园物候
          name: 问**果树当前的生长进度**：现在什么物候期、开花没有、花蕾和谢花情况、果径多大、抽梢了没有、长势如何。只讲果树的生长状态。
        - id: '1789220383321'
          label: 虫情监测
          name: 问**虫情监测设备本身的状态**：虫情灯/测报灯开没开、什么工作模式、仓温、电压、最后一次上报时间。
        - id: '1789220383891'
          label: 销售收入
          name: 问**卖果的收入**：卖了多少钱、一共收了多少钱、今年销售收入多少、什么等级什么单价、卖给了谁、销售记录。**只答金额，不答产量的斤数。**⚠️
            「摘果卖行不行」「打完药能不能卖」这类问**能不能/行不行**的，属于第 9 类（用药安全），不要选本类。
        - id: '1789232686612'
          label: 病虫害拍照识别
          name: 用户用文字说要**识别病虫害但没传图片**：这是什么病、帮我看看这片叶子、帮我识别一下病虫害。消息里没有任何照片时选此类。
