    - data:
        code: "import re\n\nBAD_PARENS = [\"（直接回答）\", \"（根据已有数据补充）\", \"（农户仍无法明确）\"\
          ,\n              \"（如果农户\", \"（农户没有明显倾向）\", \"（具体哪块地或哪个问题可以再细说）\"]\nSELF\
          \ = [\"我只管报数\", \"我只管记账\", \"我是专门管产量记账的\", \"我只负责报数\"]\n\n\ndef main(text)\
          \ -> dict:\n    raw = str(text or \"\")\n    t = raw\n    for p in BAD_PARENS:\n\
          \        t = t.replace(p, \"\")\n    t = re.sub(r\"（[^）]{0,120}(?:农户|内部提示|自我说明|我只管|报数|记账|按规则|规则要求|补充说明|按提示|根据提示|按指令|按格式|默认值|回答依据|回答口径|依据：|备注|口径：)[^）]{0,120}）\"\
          , \"\", t)\n    t = re.sub(r\"（根据(?:用户)?记忆[^）]{0,60}）\", \"\", t)      #\
          \ 整段删掉\"（根据用户记忆中的偏好…）\"\n    t = re.sub(r\"（根据(?:用户)?记忆[，,]\\s*\", \"（\"\
          , t)   # 没写右括号的，只去掉前缀\n    t = t.replace(\"确诊\", \"经农技员确认\")\n    t = t.replace(\"\
          接口\", \"系统\").replace(\"台账\", \"记录\")\n    for s in SELF:\n        t = t.replace(s,\
          \ \"我这边没有这项数据\")\n    # markdown 去壳（模型偶尔不听提示词，这里用代码兜底；统一协议 ⑦ 要求不用 markdown\
          \ 符号）\n    t = re.sub(r\"\\*\\*(.+?)\\*\\*\", r\"\\1\", t, flags=re.S)\n\
          \    t = re.sub(r\"(?m)^\\s{0,3}#{1,6}\\s*\", \"\", t)\n    t = re.sub(r\"\
          (?m)^\\s{0,3}[-*+]\\s+\", \"\", t)\n    # \U0001F534 去编号：整段删掉编号（不能留数字——留成\
          \ \"1 \" 读起来还是清单）；\n    #    必须 (?!\\d) 防误伤小数（\"30.9℃\" 会被旧写法吃成 \"30 9℃\"\
          ）。\n    t = re.sub(r\"(?m)^\\s{0,3}\\d{1,2}[.、)](?!\\d)[ \\t]*\", \"\",\
          \ t)\n    t = t.replace(\"`\", \"\").replace(\"---\", \"\")\n    t = re.sub(r\"\
          [ \\t]+\\n\", \"\\n\", t)\n    # \U0001F534 空回答保护（v74 P0-2）：LLM 偶发返回空 →\
          \ 这里给按业务类型的确定性兜底，\n    #    用户绝不会看到空白 / None。\n    is_empty = not raw.strip()\n\
          \    if is_empty:\n        t = '这次没有成功生成虫情判断，暂时不要据此决定是否用药，建议重新查询一次，或先到园里巡查确认。'\n\
          \    t = t.strip()\n    return {\"text\": t, \"changed\": \"1\" if t !=\
          \ raw.strip() else \"0\",\n            \"empty\": \"1\" if is_empty else\
          \ \"0\"}\n"
