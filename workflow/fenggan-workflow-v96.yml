    - data:
        code: "import re\n_ALIAS = {\"介壳虫\": \"蚧壳虫\", \"沙皮病\": \"砂皮病\", \"锈蜘蛛\": \"\
          锈壁虱\", \"柑橘木虱\": \"木虱\"}\n# \U0001F534 v87 R6：KB\"有效支持\"必须同时满足：① 含目标病虫名\
          \ ② 含**防治依据**信号；\n#    只提名字、只讲发生规律/巡查 → 不算知识支持（工单明确要求收紧）。\n_KB_EVID = re.compile(r\"\
          防治|防控|用药|药剂|药|稀释|倍|安全间隔|间隔期|喷施|喷雾|施用|用量\")\n\n\ndef _canon(s):\n    s =\
          \ str(s or \"\")\n    for _a, _b in _ALIAS.items():\n        s = s.replace(_a,\
          \ _b)\n    return s\n\n\ndef _kb_ok(kb, target):\n    \"\"\"\U0001F534 v81\
          \ T1：本轮知识检索是否真的为 target_pest 提供了有效资料。\n    证据门在主干上游、看不到 KB，所以这一校验放在**能看到\
          \ KB 结果的清洗节点**里做。\"\"\"\n    items = kb if isinstance(kb, list) else ((kb\
          \ or {}).get(\"result\") if isinstance(kb, dict) else [])\n    items = [x\
          \ for x in (items or []) if isinstance(x, dict)]\n    if not items:\n  \
          \      return False, \"本轮知识检索没有返回任何资料\"\n    txt = \" \".join(str(x.get(\"\
          content\") or \"\") for x in items).strip()\n    if len(txt) < 20:\n   \
          \     return False, \"本轮知识检索返回的内容为空\"\n    if target and _canon(target)\
          \ not in _canon(txt):\n        return False, \"本轮知识检索结果里没有「%s」的防治资料\" %\
          \ target\n    if not _KB_EVID.search(txt):\n        return False, \"本轮知识检索结果里没有针对「%s」的防治依据（只提到名称或发生规律）\"\
          \ % (target or \"该病虫\")\n    return True, \"\"\n\n\n# \U0001F534 v80 P1-1：只删\"\
          正向执行动作\"句，否定 / 事实 / 记录 / 条件句一律保留。\n#    旧写法按\"出现硬词就删整句\" ⇒ 会误删事实（\"最近没有轮换用药。\"\
          /\"没有补防记录。\"）。\n_EXEC = re.compile(\n    r\"(建议|可以|可|应该|适合|宜|抓紧|尽快|赶紧|及时|直接|现在|马上|立即|不妨|最好|须|需要|考虑|选用\"\
          \n    r\"|采取|开展|进行|实施)\"\n    r\"[^。！？；\\n]{0,14}?(补防|补打|补药|轮换|备药|备货|用药|打药|喷药|施药|喷施|防治|打一遍|喷一遍)\"\
          \n    r\"|(可以|建议|能|宜|不妨)[^。！？；\\n]{0,8}?再打\"\n    r\"|补防|轮换用药|安排用药|安排防治|安排喷药|该安排防治\"\
          \n    # \U0001F534 v89（P0-3 第三轮）：去掉裸\"防治措施\"——它会把知识句「知识库介绍了柑橘病虫害防治措施，\n\
          \    #    包括清园和修剪。」整句删掉、只剩残句。执行语句（采取/开展/进行/实施防治）由上面的组合式照旧覆盖。\n    r\"|采取防治|开展防治|进行防治|实施防治\"\
          )\n_SAFE = re.compile(\n    # \U0001F534 v87 R1：补\"不可以|不可|不得|不许|不该\"（否则\"\
          不可以再打药。\"会被当成正向执行动作误删）；\n    #    ⚠️ 去掉\"确认后\"——它会把\"确认后就可以用药。\"整句豁免（工单已复现的绕过点）。\n\
          \    r\"没有|没|不能|不可以|不可|不得|不许|不该|不要|不需要|不必|不宜|不建议|禁止|暂不|尚未|还没|暂无\"\n    r\"\
          |无需|避免|甭|并非|不是\"\n    r\"|未(达标|满|到|出现|发现|记录|能|见|曾)\"\n    r\"|无(补防|轮换|用药|打药|喷药|施药|备药|防治|异常|病|虫)\"\
          \n    # \U0001F534 v95（复审 P0）：去掉\"先巡查|先确认\" —— 它们会**整子句豁免**后面的执行动作\n   \
          \ #    （实测：\"建议先巡查确认后可以用药。\" 会漏放\"可以用药\"）。\n    #    安全条件式已由下方 _safe_cond\
          \ 三条件把守：核实动作 + 决策待定 + 无直接执行。\n    r\"|是否|要不要|需不需要|再决定\")\n# \U0001F534 v87\
          \ R1：\"先核实后决定\"才算安全条件式 —— 必须同时有**决策待定**语义，\n#    而且句内**没有**\"直接执行\"措辞（\"\
          确认后就可以用药 / 确认后立即补防\"一律删）。\n_DECIDE_FORM = re.compile(r\"是否|要不要|需不需要|再决定|再判断|再评估|再考虑|判断(是否|需不需要)\"\
          )\n_DIRECT_EXEC = re.compile(r\"(就|立即|马上|直接|即可|赶紧|赶快|尽快|抓紧|及时)[^。！？；\\n]{0,6}\"\
          \n                          r\"(可以|能|要|需|该)?[^。！？；\\n]{0,4}\"\n        \
          \                  r\"(用药|打药|喷药|施药|补防|补打|防治|轮换)\")\n# \U0001F534 v81 T2：条件句不是天然安全\
          \ —— \"把具体执行动作安排到未来\"也要删\n_ASK = re.compile(r\"是否|要不要|需不需要\")\n_ACT2 = re.compile(r\"\
          补防|补打|备药|轮换|用药|打药|喷药|施药|防治\")   # v85：补\"防治\"\n# \U0001F534 v85 P0-2：转折词——句级切分之后再按它切**子句**，逐子句独立判定，\n\
          #    否则\"前半句的否定词\"会把\"后半句的执行动作\"一起保护住。\n#    v86 P1-3：**所有逗号/分号都要切**（\"\
          目前不能打药，明天可以打药。\"没有连接词也得切），\n#    并且不带逗号的连接词也要切（\"虽然没有虫量但可以打药\"）；(?<!不) 防切坏\"\
          不但\"。\n# \U0001F534 v89（P0-3 第三轮）：转折词补\"可是|反而|同时\" —— 实测「目前没有实时虫量**可是**可以打药。」\n\
          #    「…**反而**可以打药。」「…**同时**可以安排用药。」因缺这些词，前半句的否定把后半句庇护住了。\n_TURN = re.compile(r\"\
          (?<=[，,；;])|(?<!不)(?=但|不过|然而|只是|另外|却|可是|反而|同时)\")\n# \U0001F534 v86 P1-4：\"\
          先巡查 / 先确认 / 确认后再决定\"属于**先核实后决定**的安全条件式 ⇒ 必须保留；\n#    只有\"把执行动作安排到未来\"（期满后\
          \ / 明天 / 下次…）才删。\n_INSPECT = re.compile(r\"先(巡查|确认|检查|看|查看|观察|查|摸|核实|判断)|确认(后|再|了)|检查(后|再)\"\
          \n                      r\"|巡查(后|再)|根据实际情况|结合实际\")\n_CONCESS = re.compile(r\"\
          ^(虽然|尽管|即使|就算)\")\n_FUT = re.compile(r\"明天|后天|之后|过后|期满|再考虑|再评估|再决定|下次|择期|过几天|隔几天\"\
          \n                  r\"|等[^。！？；\\n]{0,8}(满|过|到)\")\n\n\n\nBAD_PARENS = [\"\
          （直接回答）\", \"（根据已有数据补充）\", \"（农户仍无法明确）\",\n              \"（如果农户\", \"（农户没有明显倾向）\"\
          , \"（具体哪块地或哪个问题可以再细说）\"]\nSELF = [\"我只管报数\", \"我只管记账\", \"我是专门管产量记账的\",\
          \ \"我只负责报数\"]\n\n\ndef main(text, gate_sent, gate_level, gate_target, kb_json)\
          \ -> dict:\n    raw = str(text or \"\")\n    t = raw\n    for p in BAD_PARENS:\n\
          \        t = t.replace(p, \"\")\n    t = re.sub(r\"（[^）]{0,120}(?:农户|内部提示|自我说明|我只管|报数|记账|按规则|规则要求|补充说明|按提示|根据提示|按指令|按格式|默认值|回答依据|回答口径|依据：|备注|口径：)[^）]{0,120}）\"\
          , \"\", t)\n    t = re.sub(r\"（根据(?:用户)?记忆[^）]{0,60}）\", \"\", t)      #\
          \ 整段删掉\"（根据用户记忆中的偏好…）\"\n    t = re.sub(r\"（根据(?:用户)?记忆[，,]\\s*\", \"（\"\
          , t)   # 没写右括号的，只去掉前缀\n    t = t.replace(\"确诊\", \"经农技员确认\")\n    t = t.replace(\"\
          接口\", \"系统\").replace(\"台账\", \"记录\")\n    for s in SELF:\n        t = t.replace(s,\
          \ \"我这边没有这项数据\")\n    # markdown 去壳（模型偶尔不听提示词，这里用代码兜底；统一协议 ⑦ 要求不用 markdown\
          \ 符号）\n    t = re.sub(r\"\\*\\*(.+?)\\*\\*\", r\"\\1\", t, flags=re.S)\n\
          \    t = re.sub(r\"(?m)^\\s{0,3}#{1,6}\\s*\", \"\", t)\n    t = re.sub(r\"\
          (?m)^\\s{0,3}[-*+]\\s+\", \"\", t)\n    # \U0001F534 去编号：整段删掉编号（不能留数字——留成\
          \ \"1 \" 读起来还是清单）；\n    #    必须 (?!\\d) 防误伤小数（\"30.9℃\" 会被旧写法吃成 \"30 9℃\"\
          ）。\n    t = re.sub(r\"(?m)^\\s{0,3}\\d{1,2}[.、)](?!\\d)[ \\t]*\", \"\",\
          \ t)\n    t = t.replace(\"`\", \"\").replace(\"---\", \"\")\n    t = re.sub(r\"\
          [ \\t]+\\n\", \"\\n\", t)\n    # \U0001F534 空回答保护（v74 P0-2）：LLM 偶发返回空 →\
          \ 这里给按业务类型的确定性兜底，\n    #    用户绝不会看到空白 / None。\n    is_empty = not raw.strip()\n\
          \    if is_empty:\n        t = '这次没有成功生成虫情判断，暂时不要据此决定是否用药，建议重新查询一次，或先到园里巡查确认。'\n\
          \    # \U0001F534 口径硬保证（v74 P0-1）：decision_level 不是 strong 时，**第一句必须是证据门口径句**。\n\
          \    #    不再指望模型\"照抄\"（实测命中率不是 100%，它会把口径改写成\"建议立即补防\"这类执行级安排）。\n    gs\
          \ = str(gate_sent or \"\").strip()\n    lv = str(gate_level or \"\").strip()\n\
          \    # \U0001F534 v81 T1：strong 必须真的拿到本轮的病虫防治资料（knowledge_support 真实化）。\n\
          \    #    门内只能校验 pest_in_vocab；这里能看到本分支 KB 结果，所以在这里落实资格。\n    if lv == \"\
          strong\":\n        _gt = str(gate_target or \"\").strip()\n        _kbo,\
          \ _kbwhy = _kb_ok(kb_json, _gt)\n        if not _kbo:\n            lv =\
          \ \"insufficient\"\n            gs = (\"本园已记录到「%s」的实时虫情，但%s，现在不能安排用药；\"\n\
          \                  \"先巡查确认虫情，再决定是否用药。\") % (_gt or \"该病虫\", _kbwhy)\n  \
          \  if gs and lv and lv != \"strong\":\n        t = t.strip()\n        if\
          \ gs in t and not t.startswith(gs):\n            t = t.replace(gs, \"\"\
          , 1).strip()          # 出现在中间 → 挪到最前面，不重复\n        if not t.startswith(gs):\n\
          \            t = (gs + \"\\n\" + t).strip() if t else gs\n        # \U0001F534\
          \ 执行级句子删除（v80）：口径句之后的正文里，\"建议/可以/适合…打(喷/用)药\"、\n        #    \"补防/轮换/备药/安排用药\"\
          、\"可以/建议…再打\"这类**执行级结论**整句删掉。\n        #    提示词压不住（实测 4 处漏水），只能代码删；条件式说法（是否用药/要不要/\n\
          \        #    需不需要/先巡查确认）保留，硬词（补防/轮换/备药）无条件删。\n        _rest = t[len(gs):].strip()\n\
          \        if _rest:\n            _parts = [s for s in re.split(r\"(?<=[。！？；\\\
          n])\", _rest) if s.strip()]\n            _keep = []\n            for _s\
          \ in _parts:\n                # \U0001F534 v85 P0-2：先按转折词切成子句，**逐子句独立判定**\
          \ ——\n                #    否则\"不能用药，但明天可以安排防治\"这种会被前半句的否定词整体放行。\n      \
          \          _subs = _TURN.split(_s)\n                _kept = []\n       \
          \         _ctx_inspect = False   # \U0001F534 v86 P1-4：本句前面是否出现过\"先巡查/先确认\"\
          这类核实动作\n                for _c in _subs:\n                    if not _c.strip():\n\
          \                        continue\n                    # \U0001F534 v81\
          \ T2 + v86 P1-4：把\"具体执行动作安排到未来\"删掉；但\n                    #    \"先巡查确认…再决定是否用药\"\
          这种**先核实后决定**的安全条件式必须保留\n                    #    （后半句自己不带核实词时，看本句前面有没有出现过核实动作）。\n\
          \                    _safe_cond = ((_INSPECT.search(_c) or _ctx_inspect)\n\
          \                                  and _DECIDE_FORM.search(_c)\n       \
          \                           and not _DIRECT_EXEC.search(_c))\n         \
          \           if (_ASK.search(_c) and _ACT2.search(_c) and _FUT.search(_c)\n\
          \                            and not _safe_cond):\n                    \
          \    continue\n                    # \U0001F534 v80 P1-1：正向执行动作 → 删；**该子句内**的否定/事实/条件句\
          \ → 保留\n                    if _EXEC.search(_c) and not _SAFE.search(_c):\n\
          \                        continue\n                    if _INSPECT.search(_c):\n\
          \                        _ctx_inspect = True\n                    _kept.append(_c)\n\
          \                if not _kept:\n                    continue\n         \
          \       # \U0001F534 v86 P1-4：剩下的若只是让步从句（\"虽然没有实时虫量。\"），整段丢弃，不留残句\n    \
          \            if len(_kept) == 1 and _CONCESS.match(_kept[0].strip()):\n\
          \                    continue\n                _j = \"\".join(_kept).rstrip()\n\
          \                while _j and _j[-1] in \"，,、；; \":\n                  \
          \  _j = _j[:-1]\n                if _j and _s.rstrip().endswith((\"。\",\
          \ \"！\", \"？\")) and not _j.endswith((\"。\", \"！\", \"？\")):\n         \
          \           _j += \"。\"\n                if _j:\n                    _keep.append(_j)\n\
          \            t = (gs + \"\\n\" + \"\".join(_keep)).strip()\n    t = t.strip()\n\
          \    return {\"text\": t, \"changed\": \"1\" if t != raw.strip() else \"\
          0\",\n            \"empty\": \"1\" if is_empty else \"0\"}\n"
