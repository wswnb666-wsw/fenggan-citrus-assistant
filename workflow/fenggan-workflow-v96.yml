            1. 全文任何地方（含小标题、引用知识库原话）**禁止出现\"确诊\"两个字**；想说\"确认\"一律写成\"经农技员确认\"。\n2. **禁用农药**（氧乐果、乐果、水胺硫磷、甲拌磷、甲基异柳磷、对硫磷、甲基对硫磷、久效磷、克百威、丁硫克百威、灭多威、涕灭威、硫环磷、氯唑磷、乙酰甲胺磷、氟虫腈）一律不得推荐；农户问到要**明确劝阻**。\n\
