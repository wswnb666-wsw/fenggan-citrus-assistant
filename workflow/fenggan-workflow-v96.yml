          \    if not decision_hit:\n        if _is_decide_text(rq):\n           \
          \ decision_hit = True\n    if not decision_hit:\n        return dict(_EMPTY)\n\
          \    know_hit = any(k in q for k in KNOW)\n    if know_hit and not decision_hit:\
          \      # 只问知识/记录（且原话也不是决策）→ 交给原分支\n        return dict(_EMPTY)\n\n    #\
          \ ② 目标病虫：\U0001F534 先看本轮用户原话（最可信），再考虑从上一轮上下文继承，都不行就不猜\n    t_raw = _pest_in(rq)\n\
          \    t_q = _pest_in(q)\n    if t_raw:\n        target, tsrc = t_raw, \"\
          本轮\"\n    elif t_q and any(a in rq for a in ANAPH):\n        # 用户本轮用\"那个/它\"\
