            \ 受影响面积（单位：平方米）\n- status 状态（待处理/处理中/已处理）\n- remark 处置说明\n{{#1789201853210.body#}}\n\
            \n回答要求：\n1. 讲清楚什么时间、什么地块、什么品种、发生了什么病虫、用什么药处理、现在状态如何。\n2. 面积单位是平方米，不是亩：affectedArea\
            \ 的数字后面要说\"平方米\"，并且说明这是发现点/初发区域的受害面积，不是全园面积。\n3. 汇总问题（一共多少条、几条待处理、受灾总面积）必须引用\
