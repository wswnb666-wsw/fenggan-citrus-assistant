          ALIAS = {\"介壳虫\": \"蚧壳虫\", \"沙皮病\": \"砂皮病\", \"锈蜘蛛\": \"锈壁虱\", \"柑橘木虱\"\
          : \"木虱\"}\n\n\ndef _canon(name):\n    \"\"\"\U0001F534 v86 P0-1：病虫名别名归一化。\n\
          \    否则\"介壳虫\"的用药记录匹配不上本轮的\"蚧壳虫\" ⇒ 那条**未满安全间隔**的记录被跳过\n    ⇒ _safety 返回\"\
          没有待处理间隔\" ⇒ 和 real_time + pest_in_vocab 凑成 strong（实测复现）。\"\"\"\n    s =\
          \ str(name or \"\").strip()\n    for a, b in ALIAS.items():\n        s =\
          \ s.replace(a, b)\n    return s\n\n\ndef _safety(ml, target):\n    \"\"\"\
          安全间隔期资格（v80 P0-2 / v82 P0-1）。\U0001F534 与「算安全间隔」节点同一口径：\n    passed = 今天\
          \ - 施药日；passed >= 间隔期 才算满。取**较严**口径 ——\n    只要有任一条相关用药的间隔期还没满，就不算 eligible（项目约定：间隔期取较大值）。\n\
          \    只用现有用药记录 + 标签安全间隔期，绝不让 LLM 自己算。\n\n    \U0001F534 v82 P0-1：**\"拿不到/字段坏了\"\
          \ ≠ \"没有待处理安全间隔\"**，三种情况必须分开：\n      ① 没有相关用药记录                      → eligible（视为没有待处理安全间隔）\n\
          \      ② 有相关记录但 workTime 非法 / safetyInterval 缺失或非法 → **不能确认** → 不 eligible\n\
          \      ③ 有相关记录且能算出                     → 未满则不 eligible；全部已满才 eligible\n\
          \    \"\"\"\n    block, broken = None, None\n    ct = _canon(target)\n \
          \   # \U0001F534 v86 P0-1：用药记录里出现**无法识别**的病虫名 ⇒ 不能可靠归因，一律\"不可确认\"\n    #\
          \ \U0001F534 v87 R2：非字典 / 空字典条目**不能静默跳过**（原来会 fail-open 到 strong）\n    _bad\
          \ = [x for x in (ml or []) if not isinstance(x, dict) or not x]\n    if\
          \ _bad:\n        broken = \"用药记录里有 %d 条格式异常（不是一条记录对象）\" % len(_bad)\n  \
          \  _unk = sorted({str(x.get(\"pestName\") or \"\") for x in (ml or [])\n\
