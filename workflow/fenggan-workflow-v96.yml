    - data:
        code: "import json\nfrom datetime import datetime, timezone, timedelta\n\n\
          _NOW = (datetime.now(timezone.utc) + timedelta(hours=8)).replace(tzinfo=None)\n\
          \n\ndef _o(s):\n    try:\n        x = json.loads(s) if isinstance(s, str)\
          \ else s\n    except Exception:\n        return {}\n    return x if isinstance(x,\
          \ dict) else {}\n\n\ndef _d(s):\n    v = _o(s).get(\"data\")\n    return\
          \ v if v is not None else {}\n\n\ndef _base(today):\n    for f in (\"%Y年%m月%d日\"\
          , \"%Y-%m-%d\"):\n        try:\n            return datetime.strptime(str(today\
          \ or \"\")[:12].strip(), f)\n        except Exception:\n            continue\n\
          \    return _NOW\n\n\ndef _dlabel(t, base):\n    s = str(t or \"\")[:10]\n\
          \    try:\n        dt = datetime.strptime(s, \"%Y-%m-%d\")\n    except Exception:\n\
          \        return s\n    n = (dt.date() - base.date()).days\n    lab = (\"\
          今天\" if n == 0 else \"明天\" if n == 1 else \"后天\" if n == 2 else\n      \
          \     \"%d天后\" % n if n > 0 else \"昨天\" if n == -1 else \"过了%d天\" % (-n))\n\
          \    return \"%d月%d日(%s)\" % (dt.month, dt.day, lab)\n\n\ndef _ago(t, base):\n\
          \    s = str(t or \"\")[:10]\n    try:\n        dt = datetime.strptime(s,\
          \ \"%Y-%m-%d\")\n    except Exception:\n        return \"\"\n    n = (base.date()\
          \ - dt.date()).days\n    return \"\" if n < 0 else (\"（%d天前）\" % n if n\
          \ else \"（今天）\")\n\n\ndef sensor(s):\n    arr = _d(s)\n    if not isinstance(arr,\
          \ list) or not arr:\n        return \"① 实时环境：**这次没取到读数**\"\n    kv, times\
          \ = {}, []\n    for x in arr:\n        if not isinstance(x, dict):\n   \
          \         continue\n        kv[str(x.get(\"digitalName\") or \"\")] = x.get(\"\
          digital\")\n        if x.get(\"recordTime\"):\n            times.append(str(x[\"\
          recordTime\"]))\n    order = [\"温度\", \"湿度\", \"温度1\", \"湿度1\", \"温度2\"\
          , \"湿度2\", \"温度3\", \"湿度3\",\n             \"PH-1\", \"PH-2\", \"PH-3\"\
          , \"光照\", \"气压\", \"氮1\", \"磷1\", \"钾1\"]\n    body = \"，\".join(\"%s=%s\"\
          \ % (k, kv[k]) for k in order if k in kv)\n    t = max(times) if times else\
          \ \"\"\n    age = None\n    try:\n        age = round((_NOW - datetime.strptime(t[:19],\
          \ \"%Y-%m-%d %H:%M:%S\")).total_seconds() / 3600.0, 1)\n    except Exception:\n\
          \        pass\n    flag = \"\"\n    if age is not None and age > 6:\n  \
          \      flag += \"；⚠️读数距今约 %.1f 小时，可能没更新\" % age\n    nz = [k for k in kv\
          \ if k.startswith((\"氮\", \"磷\", \"钾\")) and str(kv[k]) in (\"0\", \"0.0\"\
          )]\n    if len(nz) >= 6:\n        flag += \"；⚠️氮磷钾读数全为 0（疑似没测到）\"\n    ph\
          \ = [str(kv.get(k)) for k in (\"PH-1\", \"PH-2\", \"PH-3\")]\n    if len(set(ph))\
          \ == 1 and ph[0] not in (\"None\", \"\"):\n        flag += \"；⚠️三个 pH 探头读数完全一致（疑似没测到）\"\
          \n    so = \"；\".join(\"%s=%s\" % (k, kv[k]) for k in (\"湿度1\", \"湿度2\"\
          , \"湿度3\") if k in kv)\n    return \"① 实时环境（现采读数）：%s\\n   采集时间 %s%s%s\"\
          \ % (\n        body, t or \"未提供\", (\"；土壤湿度三点：\" + so) if so else \"\",\
          \ flag)\n\n\ndef farm(s, base):\n    d = _d(s)\n    if not isinstance(d,\
          \ dict) or not d:\n        return \"② 农事：**这次没取到数据**\"\n    st = d.get(\"\
          stats\") or {}\n    out = [\"② 农事（worksTotal=农事全量条数；total/pending/overdue\
          \ 只指工作计划）\",\n           \"   农事记录共 %s 条；近 %s 天 %s 条；工作计划 待办%s/逾期%s/已完成%s（共%s）\"\
          \n           % (st.get(\"worksTotal\"), st.get(\"recentDays\"), st.get(\"\
          recentWorkCount\"),\n              st.get(\"pending\"), st.get(\"overdue\"\
          ), st.get(\"completed\"), st.get(\"total\"))]\n    ws = [w for w in (d.get(\"\
          works\") or []) if isinstance(w, dict)]\n    if ws:\n        out.append(\"\
          \   已完成的农活（最多5条，按日期倒序）：\" + \"；\".join(\n            \"%s %s %s\" % (_dlabel(w.get(\"\
          workTime\"), base), w.get(\"title\", \"\"), w.get(\"workType\", \"\"))\n\
          \            for w in ws[:5]))\n        _today = base.strftime(\"%Y-%m-%d\"\
          )\n        _td = [w for w in ws if str(w.get(\"workTime\") or \"\")[:10]\
          \ == _today]\n        out.append(\"   → 今天（%d月%d日）已完成的农活：%s\"\n        \
          \           % (base.month, base.day,\n                      \"；\".join(\"\
          %s %s\" % (w.get(\"title\", \"\"), w.get(\"workType\", \"\")) for w in _td)\n\
          \                      if _td else \"无\"))\n    pl = [p for p in (d.get(\"\
          plans\") or []) if isinstance(p, dict)]\n    if pl:\n        def _pdt(p):\n\
          \            try:\n                return datetime.strptime(str(p.get(\"\
          plannedTime\") or \"\")[:10], \"%Y-%m-%d\")\n            except Exception:\n\
          \                return None\n\n        def _row(p):\n            return\
          \ \"%s %s %s %s\" % (_dlabel(p.get(\"plannedTime\"), base), p.get(\"planTitle\"\
          , \"\"),\n                                    p.get(\"targetArea\", \"\"\
          ), p.get(\"planStatus\", \"\"))\n\n        td, od, fu = [], [], []\n   \
          \     for p in pl:\n            dt = _pdt(p)\n            if dt is None:\n\
          \                fu.append(p)\n            elif dt.date() == base.date():\n\
          \                td.append(p)\n            elif dt.date() < base.date():\n\
          \                od.append(p)\n            else:\n                fu.append(p)\n\
          \        # \U0001F534 三行切开：否则模型会把\"9月28日(明天)\"的计划当成\"今天的农活\"（真实事故）\n   \
          \     out.append(\"   工作计划（共 %d 条；**日期一律照抄这里的写法，不许自己换算**）：\" % len(pl))\n\
          \        out.append(\"     · 今天（%d月%d日）的计划（**问“今天有什么农活”时只有这一行算数**）：%s\"\n\
          \                   % (base.month, base.day, \"；\".join(_row(p) for p in\
          \ td) if td else \"无\"))\n        out.append(\"     · 已逾期未完成的计划（计划日期早于今天，共\
          \ %d 条；**这不是今天的农活**）：%s\"\n                   % (len(od), \"；\".join(_row(p)\
          \ for p in od[:5]) if od else \"无\"))\n        out.append(\"     · 未来的计划（日期晚于今天，共\
          \ %d 条；**问今天时一个字都不许提**）：%s\"\n                   % (len(fu), \"；\".join(_row(p)\
          \ for p in fu[:5]) if fu else \"无\"))\n    else:\n        out.append(\"\
          \   工作计划：无\")\n    return \"\\n\".join(out)\n\n\ndef pheno(s, base):\n \
          \   d = _d(s)\n    if not isinstance(d, dict) or not d:\n        return\
          \ \"③ 物候：**这次没取到数据**\"\n    out = [\"③ 物候\"]\n    for key, label in ((\"\
          fruit\", \"果径\"), (\"flowering\", \"花期\"), (\"shoot\", \"抽梢\"), (\"growth\"\
          , \"长势\")):\n        arr = [x for x in (d.get(key) or []) if isinstance(x,\
          \ dict)]\n        if not arr:\n            continue\n        rows = []\n\
          \        for x in arr[:3]:\n            extra = \"\"\n            if key\
          \ == \"fruit\":\n                extra = \"横%s/纵%smm\" % (x.get(\"transverseDiameter\"\
          ), x.get(\"longitudinalDiameter\"))\n            elif key == \"flowering\"\
          :\n                extra = str(x.get(\"stage\") or \"\")\n            elif\
          \ key == \"shoot\":\n                extra = str(x.get(\"shootType\") or\
          \ \"\")\n            rows.append(\"%s%s %s %s %s\" % (x.get(\"recordDate\"\
          ), _ago(x.get(\"recordDate\"), base),\n                                \
          \           x.get(\"cropType\"), extra, str(x.get(\"area\") or \"\")))\n\
          \        out.append(\"   %s（近3条）：%s\" % (label, \"；\".join(rows)))\n   \
          \ return \"\\n\".join(out)\n\n\ndef yld(s, base):\n    arr = _d(s)\n   \
          \ if not isinstance(arr, list) or not arr:\n        return \"④ 产量：**这次没取到数据**\"\
          \n    arr = [x for x in arr if isinstance(x, dict)]\n    arr.sort(key=lambda\
          \ x: str(x.get(\"recordDate\") or \"\"), reverse=True)\n    newest = str(arr[0].get(\"\
          recordDate\") or \"\") if arr else \"\"\n    rows = [\"%s%s %s %s(%s) 亩产%s\
          \ %s\" % (x.get(\"recordDate\"), _ago(x.get(\"recordDate\"), base),\n  \
          \                                      x.get(\"cropType\"), x.get(\"yield\"\
          ), x.get(\"unit\"),\n                                        x.get(\"yieldPerMu\"\
          ), x.get(\"area\")) for x in arr[:6]]\n    return (\"④ 产量记录（**按产季记录，不是按自然年**；最新一条\
          \ %s%s，共 %d 条，按日期倒序取前 6 条）：\"\n            % (newest, _ago(newest, base),\
          \ len(arr))) + \"；\".join(rows)\n\n\ndef sales(s, base):\n    d = _d(s)\n\
          \    if not isinstance(d, dict) or not d:\n        return \"⑤ 销售：**这次没取到数据**\"\
          \n    sm = d.get(\"summary\") or {}\n    out = [\"⑤ 销售（summary 是全库合计，不受\
          \ limit 影响）\",\n           \"   共 %s 笔，合计 %s 斤 / %s 元，加权均价 %s 元/斤\" % (\n\
          \               sm.get(\"recordCount\"), sm.get(\"totalQuantity\"), sm.get(\"\
          totalAmount\"),\n               sm.get(\"weightedAvgPrice\"))]\n    ty =\
          \ sm.get(\"thisYear\") or {}\n    if ty:\n        out.append(\"   今年（%s年）：%s\
          \ 斤 / %s 元\" % (ty.get(\"year\"), ty.get(\"quantity\"), ty.get(\"amount\"\
          )))\n    bg = sm.get(\"byGrade\") or []\n    if bg:\n        out.append(\"\
          \   按等级：\" + \"；\".join(\"%s %s斤/%s元 均价%s\" % (g.get(\"grade\"), g.get(\"\
          quantity\"),\n                                                         \
          \         g.get(\"amount\"), g.get(\"weightedPrice\"))\n               \
          \                             for g in bg[:4]))\n    return \"\\n\".join(out)\n\
          \n\ndef pest(s, base):\n    arr = _d(s)\n    raw = []\n    if isinstance(arr,\
          \ list):\n        raw = [x for x in arr if isinstance(x, dict)]\n    elif\
          \ isinstance(arr, dict):\n        raw = [x for x in (arr.get(\"list\") or\
          \ []) if isinstance(x, dict)]\n    seen, rows, clean = set(), [], []\n \
          \   for x in raw:\n        name = str(x.get(\"hazardName\") or \"\")\n \
          \       stamp = \"%s %s %s\" % (str(x.get(\"recordTime\") or \"\")[:16],\
          \ name, x.get(\"status\"))\n        if \"未发现\" in name or \"未发现\" in str(x.get(\"\
          remark\") or \"\"):\n            clean.append(str(x.get(\"recordTime\")\
          \ or \"\")[:16])\n            continue\n        if name in seen:\n     \
          \       continue\n        seen.add(name)\n        rows.append(\"%s%s %s\
          \ %s %s\" % (str(x.get(\"recordTime\") or \"\")[:16],\n                \
          \                       _ago(x.get(\"recordTime\"), base), name,\n     \
          \                                  x.get(\"location\"), x.get(\"status\"\
          )))\n        if len(rows) >= 5:\n            break\n    out = []\n    if\
          \ rows:\n        out.append(\"⑥ 病虫害记录（**发现过**的，最多5条）：\" + \"；\".join(rows))\n\
          \    else:\n        out.append(\"⑥ 病虫害记录：**没有发现过病虫害的记录**\")\n    if clean:\n\
          \        out.append(\"   （另有 %d 条虫情设备自动上报的『未发现虫害』记录，最近一条 %s；\"\n       \
          \            \"这只说明设备看过没发现，**不等于现场没有虫**）\" % (len(clean), max(clean)))\n\
          \    return \"\\n\".join(out)\n\n\ndef _safety(d, base):\n    \"\"\"\U0001F534\
          \ 安全间隔期硬算（与独立节点同一套算法）：LLM 只许照抄，不许自己算天数。\"\"\"\n    lst = [x for x in (d.get(\"\
          list\") or []) if isinstance(x, dict)]\n    lst.sort(key=lambda x: str(x.get(\"\
          workTime\") or \"\"), reverse=True)\n    rows = []\n    for x in lst[:5]:\n\
          \        drug = str(x.get(\"pesticideName\") or \"\").strip() or \"未填药名\"\
          \n        pest = str(x.get(\"pestName\") or \"\").strip()\n        who =\
          \ \"（防%s）\" % pest if pest else \"\"\n        raw = str(x.get(\"workTime\"\
          ) or \"\")[:10]\n        try:\n            dt = datetime.strptime(raw, \"\
          %Y-%m-%d\")\n        except Exception:\n            rows.append(\"   - %s：施药日期缺失\
          \ → 算不出来，不许猜\" % (drug + who))\n            continue\n        try:\n   \
          \         si = int(float(x.get(\"safetyInterval\")))\n        except Exception:\n\
          \            si = 0\n        if si <= 0:\n            rows.append(\"   -\
          \ %s 施药 %s%s：没填间隔期 → 算不出来，以农药标签为准\"\n                        % (raw, drug,\
          \ who))\n            continue\n        passed = (base.date() - dt.date()).days\n\
          \        left = si - passed\n        v = (\"❌未达到（还差 %d 天，不许说已过/可以采）\" %\
          \ left) if left > 0 \\\n            else (\"✅已达到（超出 %d 天）\" % (-left))\n\
          \        rows.append(\"   - %s 施药 %s%s：间隔期 %d 天，已过 %d 天，%s\"\n         \
          \           % (raw, drug, who, si, passed, v))\n    if not rows:\n     \
          \   return \"   安全间隔期：记录里没有带日期的施药条目，算不出来（不许猜）。\"\n    return (\"   安全间隔期（已按今天硬算好，直接照说，禁止自己再算）：\\\
          n\" + \"\\n\".join(rows))\n\n\ndef med(s, base):\n    d = _d(s)\n    if\
          \ not isinstance(d, dict) or not d:\n        return \"⑦ 用药记录：**这次没取到数据**\"\
          \n    sm = d.get(\"summary\") or {}\n    out = [\"⑦ 用药记录：共 %s 次，最早 %s，最近\
