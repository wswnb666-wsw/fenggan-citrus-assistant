          ) if isinstance(jd, dict) else None\n        if isinstance(dd, dict):\n\
          \            _ld = dd.get(\"latestDetect\") or {}\n            rt = str((_ld.get(\"\
          text\") if isinstance(_ld, dict) else \"\") or \"\").strip()\n    except\
          \ Exception:\n        rt = \"\"\n    try:\n        qq = str(question or\
          \ \"\")\n    except Exception:\n        qq = \"\"\n    OBJ = '柑橘木虱|木虱|红蜘蛛|全爪螨|锈壁虱|锈蜘蛛|蚜虫|潜叶蛾|蓟马|介壳虫|蚧壳虫|矢尖蚧|糠片蚧|粉虱|黑刺粉虱|实蝇|大实蝇|小实蝇|天牛|星天牛|褐天牛|柑橘凤蝶|凤蝶|溃疡病|炭疽病|疮痂病|沙皮病|黄龙病|煤烟病|脂点黄斑病|黑星病|脚腐病|树脂病|流胶病|根腐病|疫病|灰霉病|青霉病|绿霉病|蒂腐病|酸腐病|黄斑病|烟煤病|日灼病'\n\
          \    asked = [o for o in OBJ if o in qq]\n    hit = [o for o in asked if\
          \ o in rt]\n    caveat = \"\"\n    if not hit:\n        if asked:\n    \
          \        _why = \"本轮没有“%s”的实时识别数据（设备最近识别到的是别的东西），只有历史记录\" % \"、\".join(asked)\n\
          \        else:\n            _why = \"农户没点明具体病虫，本轮没有它的实时识别数据，手上只有历史记录\"\n\
          \        caveat = (\"【\U0001F534 本轮口径 —— 你的回答第一句必须原样照抄下面这一句（不许改写、不许省略）】\\\
          n\"\n                  \"这些记录只说明过去，不能代表现在的情况。\\n\"\n                  \"\
          （为什么：%s。）\\n\\n\" % _why)\n    d = None\n    try:\n        j = json.loads(med_json)\
          \ if isinstance(med_json, str) else med_json\n        d = j.get(\"data\"\
          ) if isinstance(j, dict) else None\n    except Exception:\n        d = None\n\
          \    today = (datetime.now(timezone.utc) + timedelta(hours=8)).replace(tzinfo=None)\n\
          \    if not isinstance(d, dict):\n        return {\"text\": caveat + \"\
          【安全间隔期】这次没取到用药记录，算不出来。只能告诉农户\"\n                        \"“查不到用药记录，算不出天数”，不许猜。\"\
          }\n\n    lst = [x for x in (d.get(\"list\") or []) if isinstance(x, dict)]\n\
          \    lst.sort(key=lambda x: str(x.get(\"workTime\") or \"\"), reverse=True)\n\
          \n    rows = []\n    for x in lst[:6]:\n        drug = str(x.get(\"pesticideName\"\
          ) or \"\").strip() or \"未填药名\"\n        pest = str(x.get(\"pestName\") or\
          \ \"\").strip()\n        who = \"（防%s）\" % pest if pest else \"\"\n    \
          \    raw = str(x.get(\"workTime\") or \"\")[:10]\n        try:\n       \
          \     dt = datetime.strptime(raw, \"%Y-%m-%d\")\n        except Exception:\n\
          \            rows.append(\"- %s：施药日期缺失/格式不对 → 算不出来，只说“记录里日期不全”，不许猜\"\n \
          \                       % (drug + who))\n            continue\n        try:\n\
          \            si = int(float(x.get(\"safetyInterval\")))\n        except\
          \ Exception:\n            si = 0\n        if si <= 0:\n            rows.append(\"\
          - %s 施药 %s%s：记录里没填安全间隔期 → 算不出来，只能说\"\n                        \"“以农药标签为准”，不许猜\"\
          \ % (raw, drug, who))\n            continue\n        passed = (today.date()\
          \ - dt.date()).days\n        left = si - passed\n        if left > 0:\n\
          \            verdict = \"❌未达到（还差 %d 天）：不许说“已过 / 已经到了 / 可以采 / 可以再打”\" % left\n\
          \        else:\n            verdict = \"✅已达到（超出 %d 天）：可以说“已经过了安全间隔期”\" %\
          \ (-left)\n        rows.append(\"- %s 施药 %s%s：间隔期 %d 天，已过 %d 天，%s\"\n  \
          \                  % (raw, drug, who, si, passed, verdict))\n\n    if not\
          \ rows:\n        return {\"text\": caveat + \"【安全间隔期】用药记录里没有带日期的施药条目，算不出来。\"\
          \n                        \"只说“记录里没有可用的施药日期”，不许猜。\"}\n\n    head = (\"【安全间隔期（系统已按今天\
          \ %s 算好；下面每个天数都是算出来的，\"\n            \"**直接照说，禁止自己再算一遍**）】\" % today.strftime(\"\
          %Y年%m月%d日\"))\n    tail = (\"【口径】状态“未达到”时，只能回答“还差 N 天、暂时不能采 / 不能再打”；\"\n\
          \            \"只有“已达到”才可以说“已经过了安全间隔期”。条目标了“算不出来”时，\"\n            \"直说算不出来、以农药标签为准。\"\
          )\n    return {\"text\": caveat + head + \"\\n\" + \"\\n\".join(rows) +\
          \ \"\\n\" + tail}\n"
