    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"记忆净化：改写用（确定性 Code 节点）。\n给【问题改写】用的记忆副本：把**含病虫名的记忆条目**整条剔除。\n\
          原因（09-28 实测事故）：用户记忆里存着「东区苗圃的溃疡病反复发作」，\n   农户问「那个要不要打药？」时，改写模型会拿记忆里的溃疡病去替换上一轮真正在聊的红蜘蛛\n\
          \   —— 对象直接答错。改写节点的职责只是\"补全省略句\"，病虫名**只允许来自对话历史**，\n   所以这里把记忆里的病虫名污染源先摘掉，让\"\
          不许用记忆里的病虫名\"从提示词要求变成物理事实。\n其余信息（品种 / 地块 / 基地 / 回答偏好）一律保留，其它分支不受影响。\n\"\"\
          \"\nimport json\n\nPEST = [\"溃疡病\", \"黄龙病\", \"炭疽病\", \"疮痂病\", \"黑斑病\",\
          \ \"树脂病\", \"流胶病\",\n        \"脚腐病\", \"煤烟病\", \"砂皮病\", \"脂点黄斑病\", \"疫病\"\
          , \"青霉病\", \"绿霉病\",\n        \"红蜘蛛\", \"蚜虫\", \"潜叶蛾\", \"蚧壳虫\", \"粉虱\",\
          \ \"蓟马\", \"实蝇\",\n        \"凤蝶\", \"锈壁虱\", \"木虱\", \"天牛\", \"卷叶蛾\", \"\
          蝽\", \"螨\", \"蜗牛\",\n        \"线虫\", \"地老虎\", \"金龟子\", \"象甲\", \"螟\", \"\
          白粉虱\",\n        \"病害\", \"虫害\", \"病虫\", \"虫情\"]\n\n\ndef main(mem) -> dict:\n\
          \    raw = str(mem or \"\")\n    try:\n        j = json.loads(raw)\n   \
          \ except Exception:\n        # 解析不了就原样交出去（有别的节点兜底），绝不因为净化失败而中断\n       \
          \ return {\"text\": raw, \"removed\": \"0\"}\n    if not isinstance(j, dict):\n\
          \        return {\"text\": raw, \"removed\": \"0\"}\n\n    d = j.get(\"\
          data\")\n    ms = d.get(\"memories\") if isinstance(d, dict) else None\n\
          \    if not isinstance(ms, list):\n        return {\"text\": raw, \"removed\"\
          : \"0\"}\n\n    keep, drop = [], []\n    for m in ms:\n        c = str((m\
          \ or {}).get(\"content\") or \"\") if isinstance(m, dict) else str(m)\n\
          \        (drop if any(p in c for p in PEST) else keep).append(m)\n\n   \
          \ if isinstance(d, dict):\n        d[\"memories\"] = keep\n        if drop:\n\
          \            d[\"_pest_memories_filtered\"] = (\n                \"已剔除 %d\
          \ 条含病虫名的记忆（防指代污染：病虫对象只许从对话历史来）\" % len(drop))\n    return {\"text\": json.dumps(j,\
          \ ensure_ascii=False), \"removed\": str(len(drop))}\n"
        code_language: python3
        desc: 剔除含病虫名的记忆条目（防「那个」指代被记忆带偏，病虫对象只许从对话历史来）
        outputs:
          removed:
            children: null
            type: string
          text:
            children: null
            type: string
        selected: false
        title: 记忆净化：改写用
