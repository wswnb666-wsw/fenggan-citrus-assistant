    - data:
        code: "import json\n\n# 指标名 → 农户问法（土壤探头带数字，气象站不带数字）\nRULES = [\n    ((\"土壤温度\"\
          , \"地温\", \"土温\", \"地里的温度\"), [\"温度1\", \"温度2\", \"温度3\"]),\n    ((\"土壤湿度\"\
          , \"墒情\", \"地干\", \"地里湿\", \"土壤水分\"), [\"湿度1\", \"湿度2\", \"湿度3\"]),\n  \
          \  ((\"气温\", \"空气温度\", \"天气\", \"热不热\", \"冷不冷\", \"高温\", \"低温\", \"温度\"\
          ), [\"温度\"]),\n    ((\"空气湿度\", \"空气湿\"), [\"湿度\"]),\n    ((\"光照\", \"日照\"\
          , \"光合\"), [\"光照\"]),\n    ((\"气压\",), [\"气压\"]),\n    ((\"ph\", \"PH\"\
          , \"酸碱\"), [\"PH-1\", \"PH-2\", \"PH-3\"]),\n    ((\"氮\", \"磷\", \"钾\",\
          \ \"养分\", \"肥力\"), [\"氮1\", \"氮2\", \"氮3\", \"磷1\", \"磷2\", \"磷3\", \"钾1\"\
          , \"钾2\", \"钾3\"]),\n]\nDEFAULT = [\"温度1\", \"温度2\", \"温度3\", \"湿度1\", \"\
          湿度2\", \"湿度3\",\n           \"温度\", \"湿度\", \"光照\", \"气压\", \"PH-1\"]\n\n\
          \ndef main(query, body) -> dict:\n    q = str(query or \"\")\n    rows =\
          \ []\n    try:\n        d = json.loads(str(body))\n        if isinstance(d,\
          \ dict):\n            rows = d.get(\"data\") or []\n        elif isinstance(d,\
          \ list):\n            rows = d\n    except Exception:\n        rows = []\n\
          \    if not rows:\n        return {\"table\": \"（系统里没有历史统计数据）\", \"metrics\"\
          : \"\", \"days\": \"\", \"picked\": \"\", \"scope\": \"\"}\n    names =\
          \ sorted(set(str(r.get(\"digitalName\")) for r in rows if r.get(\"digitalName\"\
          )))\n    ql = q.lower()\n    want = []\n    for kws, ms in RULES:\n    \
          \    if any((k.lower() in ql) for k in kws):\n            want += ms\n \
          \   if not want:\n        want = [m for m in DEFAULT if m in names] or names\n\
          \    want = [m for m in dict.fromkeys(want)]\n    picked = [m for m in want\
          \ if m in names]\n    days = sorted(set(str(r.get(\"day\")) for r in rows\
          \ if r.get(\"day\")))\n    lines, suspect = [], []\n    for m in picked:\n\
          \        # 先滤掉\"样本极少且恒为 0\"的噪声行（坏探头偶发上报），免得把最小值拉成 0\n        rs = [r for\
          \ r in rows if r.get(\"digitalName\") == m\n              and not ((r.get(\"\
          cnt\") or 0) <= 3 and (r.get(\"maxV\") or 0) == 0)]\n        byday = {}\n\
          \        for r in rs:\n            byday.setdefault(str(r.get(\"day\")),\
          \ []).append(r)\n        for day in sorted(byday):\n            # 当天\"整台读数恒为\
          \ 0\"的设备按\"没测到\"处理，不计入均值/极值（否则最小值会被拉成 0）\n            grp = [r for r in\
          \ byday[day] if (r.get(\"maxV\") or 0) != 0] or byday[day]\n           \
          \ cnt = sum((r.get(\"cnt\") or 0) for r in grp)\n            if not cnt:\n\
          \                continue\n            wavg = sum((r.get(\"avgV\") or 0)\
          \ * (r.get(\"cnt\") or 0) for r in grp) / cnt\n            lo = min((r.get(\"\
          minV\") or 0) for r in grp)\n            hi = max((r.get(\"maxV\") or 0)\
          \ for r in grp)\n            devs = len(set(str(r.get(\"deviceNum\")) for\
          \ r in grp))\n            lines.append(\"%s｜%s｜均%.2f｜低%.2f｜高%.2f｜%d次/%d台\"\
          \n                         % (day, m, wavg, lo, hi, cnt, devs))\n      \
          \  vals = [r.get(\"avgV\") or 0 for r in rs if (r.get(\"cnt\") or 0) > 2]\n\
          \        if vals and max(vals) == 0 and min(vals) == 0:\n            suspect.append(\"\
          %s（有样本的读数全为 0，疑似未测到）\" % m)\n    # \U0001F534 覆盖范围口径（P1-5）：农户问的范围比系统实际覆盖的长\
          \ → 第一句必须先把范围说死\n    scope = \"\"\n    _pairs = ((\"一个月\", 30), (\"整月\"\
          , 30), (\"30天\", 30), (\"一季度\", 90), (\"季度\", 90),\n              (\"三个月\"\
          , 90), (\"半个月\", 15), (\"15天\", 15), (\"一周\", 7), (\"一星期\", 7),\n      \
          \        (\"本周\", 7), (\"这周\", 7), (\"7天\", 7), (\"十天\", 10), (\"10天\",\
          \ 10),\n              (\"三天\", 3), (\"3天\", 3), (\"两天\", 2), (\"2天\", 2))\n\
          \    _req, _lab = 0, \"\"\n    for _kw, _dd in _pairs:\n        if _kw in\
          \ q and _dd > _req:\n            _req, _lab = _dd, _kw\n    if _req and\
          \ days and len(days) < _req:\n        scope = (\"【\U0001F534 覆盖范围口径 —— 你的回答第一句必须照这句写（可微调措辞，但“只有…、没有完整的…”这层意思必须保留）】\"\
          \n                 \"系统里目前只有 %s 到 %s 这 %d 天的数据，**没有你问的「最近%s」那么长**；下面讲的都只是这\
          \ %d 天的情况。\\n\"\n                 % (days[0], days[-1], len(days), _lab,\
          \ len(days)))\n    table = \"\\n\".join(lines) if lines else \"（要的这几项系统里没有数据）\"\
          \n    note = \"\"\n    if suspect:\n        note = \"\\n【可疑指标】\" + \"、\"\
          .join(suspect)\n    return {\n        \"table\": table + note,\n       \
          \ \"metrics\": \"、\".join(names),\n        \"days\": \"%s ~ %s（共 %d 天）\"\
          \ % (days[0], days[-1], len(days)) if days else \"\",\n        \"picked\"\
          : \"、\".join(picked),\n        \"scope\": scope,\n    }\n"
        code_language: python3
        desc: 把 69KB 原始 JSON 压成紧凑小表（按问题挑指标）——模型不再漏读字段
        outputs:
          days:
            children: null
            type: string
          metrics:
            children: null
            type: string
          picked:
            children: null
            type: string
          scope:
            children: null
            type: string
          table:
            children: null
            type: string
