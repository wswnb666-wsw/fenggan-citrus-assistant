          \        safety_ok = False\n        safety_note = \"用药记录本轮未能可靠获取，暂不能确认安全间隔\"\
          \n    else:\n        safety_ok, safety_note = _safety(ml, target)\n    if\
          \ badtime:\n        # \U0001F534 v86 P0-2：目标病虫的记录里有时间戳异常（比当前时间还晚 / 无法识别）\n\
          \        #    ⇒ 不得据此判断实时虫情，**不得 strong**（设备时间错、录入错、接口异常都可能造成）\n        level\
          \ = \"insufficient\"\n        sen = (\"「%s」的虫情记录里有 %d 条时间戳异常（比当前时间还晚或无法识别），\"\
          \n               \"不能据此判断实时虫情；先检查设备时间或现场确认虫情，再决定是否用药。\") % (\n         \
          \   target, len(badtime))\n    elif real_time and pest_in_vocab and safety_ok:\n\
          \        level = \"strong\"\n        sen = (\"本园近 %d 天已经记录到「%s」（设备识别到 %d\
          \ 头），可以按防治指标安排用药；\"\n               \"药剂、倍数和安全间隔期以本回答里的资料为准。\") % (REAL_DAYS,\
          \ target, best)\n    elif real_time and pest_in_vocab and not safety_ok:\n\
          \        level = \"insufficient\"\n        sen = (\"本园近 %d 天已经记录到「%s」（设备识别到\
          \ %d 头），虫量已达到需要关注的程度；\"\n               \"但%s，现在还不能安排用药，先巡查确认虫情，再决定是否用药。\"\
          ) % (\n            REAL_DAYS, target, best, safety_note)\n    elif recent:\n\
          \        level = \"insufficient\"\n        sen = (\"设备近 %d 天识别到「%s」%s，还没到需要打药的程度；当前证据不足，\"\
          \n               \"先巡查确认虫情，再决定是否用药。\") % (\n            REAL_DAYS, target,\
          \ (\"（%s 头）\" % best) if best is not None else \"（没有虫量数字）\")\n    elif historical:\n\
          \        level = \"insufficient\"\n        sen = (\"最近 %d 天没有「%s」的实时虫量证据，只有更早的记录；当前证据不足，\"\
          \n               \"先巡查确认虫情，再决定是否用药。\") % (REAL_DAYS, target)\n    else:\n\
          \        level = \"insufficient\"\n        sen = (\"记录里没有「%s」的虫情证据%s；当前证据不足，先巡查确认虫情，再决定是否用药。\"\
          ) % (\n            target, (\"（最近记录到的是：%s，不能拿来推断「%s」）\" % (\"、\".join(others[:3]),\
          \ target))\n            if others else \"\")\n\n    # \U0001F534 继承来的对象：第一句先确认对象，农户一眼能看出系统说的是哪一种\n\
          \    if tsrc == \"继承\":\n        sen = \"你说的是「%s」吧？%s\" % (target, sen)\n\
          \n    return _ret(level, target, sen,\n                _block(level, target,\
          \ sen, best, historical, med_rec, pest_in_vocab,\n                     \
          \  real_time=real_time, src=tsrc, safety_ok=safety_ok,\n               \
          \        safety_note=safety_note),\n                best, historical, med_rec,\
          \ pest_in_vocab, real_time)\n\n\ndef _block(level, target, sen, best, historical,\
          \ med_rec, vocab_ok, real_time=None, src=\"\",\n           safety_ok=True,\
          \ safety_note=\"\"):\n    if real_time is None:\n        rt = isinstance(best,\
          \ (int, float)) and best >= STRONG_MIN\n    else:\n        rt = bool(real_time)\n\
          \    buf = [\"【\U0001F534 用药决策证据门（系统已按硬证据判好；这一块是你做结论的唯一依据）】\",\n       \
          \    \"decision_level=%s   target_pest=%s\" % (level or \"-\", target or\
          \ \"-\"),\n           \"real_time_evidence=%s  historical_record=%s  medication_record=%s\
          \  pest_in_vocab=%s\" % (\n               \"true\" if rt else \"false\"\
          ,\n               \"true\" if historical else \"false\",\n             \
          \  \"true\" if med_rec else \"false\",\n               \"true\" if vocab_ok\
          \ else \"false\"),\n           \"\U0001F534 pest_in_vocab 只表示「病虫名在词表内」，**不代表本轮知识检索有效**；\"\
          \n           \"本轮 KB 是否真的给出该病虫的防治资料，由下游清洗节点按 KB 结果校验（不通过则降级）。\",\n     \
          \      \"safety_eligible=%s%s\" % (\"true\" if safety_ok else \"false\"\
          ,\n                                     (\"   ← \" + safety_note) if (not\
          \ safety_ok and safety_note) else \"\"),\n           \"决策口径（你的回答第一句必须原样照抄这一句）：%s\"\
          \ % sen,\n           \"\U0001F534 只有 decision_level=strong 才允许出现「可以安排用药」这类执行级说法；\"\
          ,\n           \"   strong 的前提是 real_time + pest_in_vocab + safety_eligible\
