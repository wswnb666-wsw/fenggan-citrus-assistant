          \        if passed < iv:\n            left = iv - passed\n            if\
          \ block is None or left > block[0]:\n                block = (left, \"%s\
          \ 用的 %s（间隔期 %d 天）还差 %d 天\" % (\n                    dt.strftime(\"%m月%d日\"\
          ), x.get(\"pesticideName\") or \"该药\", iv, left))\n    if block:\n     \
          \   return False, block[1]\n    if broken:\n        return False, \"%s，暂不能确认安全间隔\"\
          \ % broken\n    return True, \"\"\n\n\n_EMPTY = {\"text\": \"\", \"decision_level\"\
          : \"\", \"target_pest\": \"\",\n          \"real_time_evidence\": \"false\"\
          , \"historical_record\": \"false\",\n          \"medication_record\": \"\
          false\", \"pest_in_vocab\": \"false\",\n          \"decision_sentence\"\
          : \"\"}\n\n\ndef _ret(level, target, sen, text, best=None, historical=False,\
          \ med_rec=False,\n         vocab_ok=False, real_time=False):\n    return\
          \ {\"text\": text, \"decision_level\": level, \"target_pest\": target,\n\
          \            \"real_time_evidence\": \"true\" if real_time else \"false\"\
          ,\n            \"historical_record\": \"true\" if historical else \"false\"\
          ,\n            \"medication_record\": \"true\" if med_rec else \"false\"\
          ,\n            \"pest_in_vocab\": \"true\" if vocab_ok else \"false\",\n\
          \            \"decision_sentence\": sen}\n\n\n# \U0001F534 v91（P0-1 补齐）：决策识别改为**分句级**，见文件末尾追加的\
          \ SPEC。\n\n\ndef main(question, pest_json, med_json, raw) -> dict:\n   \
          \ q = str(question or \"\").strip()\n    rq = str(raw or \"\").strip()\n\
          \n    # ① 是不是\"执行决策\"型？\U0001F534 v80 P0-1：决策意图**同时看改写结果和用户原话**，统一成一个变量。\n\
          \    #    实测事故：原话\"那个要不要打药？\"被改写成\"红蜘蛛过了间隔期吗？\"，\n    #    旧写法第二层只查 q 里的决策词\
          \ ⇒ 命中 KNOW(\"间隔期\") ⇒ 证据门被提前清空\n    #    ⇒ 后面 LLM 失去约束、答出\"可以再打\"。⇒ 只要**原话**是执行决策，KNOW\
          \ 绝不能清空证据门。\n    decision_hit = any(d in q for d in DECIDE) or any(d in\
