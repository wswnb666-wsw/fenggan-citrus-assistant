          \ if p in q]\n    fm_hit = [f for f in FARM_ASK if f in q]\n    sf_hit =\
          \ [s for s in SAFETY if s in q]\n    p_sub = [p for p in PLOT_SUBJ if p\
          \ in q]\n    p_ask = [a for a in PLOT_ASK if a in q]\n    p_block = [b for\
