          \    pest_in_vocab = target in PEST   # \U0001F534 v81：如实命名——只表示\"病虫名在词表内\"\
          ，不代表本轮知识检索有效（真正的知识校验在下游清洗节点）\n    ml = mdd.get(\"list\") if isinstance(mdd,\
          \ dict) else None\n    med_rec = bool([x for x in (ml or []) if isinstance(x,\
