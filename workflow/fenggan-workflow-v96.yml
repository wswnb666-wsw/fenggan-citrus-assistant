          确认后\"——它会把\"确认后就可以用药。\"整句豁免（工单已复现的绕过点）。\n    r\"没有|没|不能|不可以|不可|不得|不许|不该|不要|不需要|不必|不宜|不建议|禁止|暂不|尚未|还没|暂无\"\
          \n    r\"|无需|避免|甭|并非|不是\"\n    r\"|未(达标|满|到|出现|发现|记录|能|见|曾)\"\n    r\"|无(补防|轮换|用药|打药|喷药|施药|备药|防治|异常|病|虫)\"\
          \n    # \U0001F534 v95（复审 P0）：去掉\"先巡查|先确认\" —— 它们会**整子句豁免**后面的执行动作\n   \
          \ #    （实测：\"建议先巡查确认后可以用药。\" 会漏放\"可以用药\"）。\n    #    安全条件式已由下方 _safe_cond\
          \ 三条件把守：核实动作 + 决策待定 + 无直接执行。\n    r\"|是否|要不要|需不需要|再决定\")\n# \U0001F534 v87\
          \ R1：\"先核实后决定\"才算安全条件式 —— 必须同时有**决策待定**语义，\n#    而且句内**没有**\"直接执行\"措辞（\"\
          确认后就可以用药 / 确认后立即补防\"一律删）。\n_DECIDE_FORM = re.compile(r\"是否|要不要|需不需要|再决定|再判断|再评估|再考虑|判断(是否|需不需要)\"\
          )\n_DIRECT_EXEC = re.compile(r\"(就|立即|马上|直接|即可|赶紧|赶快|尽快|抓紧|及时)[^。！？；\\n]{0,6}\"\
          \n                          r\"(可以|能|要|需|该)?[^。！？；\\n]{0,4}\"\n        \
          \                  r\"(用药|打药|喷药|施药|补防|补打|防治|轮换)\")\n# \U0001F534 v81 T2：条件句不是天然安全\
          \ —— \"把具体执行动作安排到未来\"也要删\n_ASK = re.compile(r\"是否|要不要|需不需要\")\n_ACT2 = re.compile(r\"\
          补防|补打|备药|轮换|用药|打药|喷药|施药|防治\")   # v85：补\"防治\"\n# \U0001F534 v85 P0-2：转折词——句级切分之后再按它切**子句**，逐子句独立判定，\n\
          #    否则\"前半句的否定词\"会把\"后半句的执行动作\"一起保护住。\n#    v86 P1-3：**所有逗号/分号都要切**（\"\
          目前不能打药，明天可以打药。\"没有连接词也得切），\n#    并且不带逗号的连接词也要切（\"虽然没有虫量但可以打药\"）；(?<!不) 防切坏\"\
          不但\"。\n# \U0001F534 v89（P0-3 第三轮）：转折词补\"可是|反而|同时\"。\n_TURN = re.compile(r\"\
          (?<=[，,；;])|(?<!不)(?=但|不过|然而|只是|另外|却|可是|反而|同时)\")\n# \U0001F534 v86 P1-4：\"\
          先巡查 / 先确认 / 确认后再决定\"属于**先核实后决定**的安全条件式 ⇒ 必须保留；\n#    只有\"把执行动作安排到未来\"（期满后\
          \ / 明天 / 下次…）才删。\n_INSPECT = re.compile(r\"先(巡查|确认|检查|看|查看|观察|查|摸|核实|判断)|确认(后|再|了)|检查(后|再)\"\
          \n                      r\"|巡查(后|再)|根据实际情况|结合实际\")\n_CONCESS = re.compile(r\"\
          ^(虽然|尽管|即使|就算)\")\n_FUT = re.compile(r\"明天|后天|之后|过后|期满|再考虑|再评估|再决定|下次|择期|过几天|隔几天\"\
          \n                  r\"|等[^。！？；\\n]{0,8}(满|过|到)\")\n\n\n\nBAD_PARENS = [\"\
          （直接回答）\", \"（根据已有数据补充）\", \"（农户仍无法明确）\",\n              \"（如果农户\", \"（农户没有明显倾向）\"\
          , \"（具体哪块地或哪个问题可以再细说）\"]\nSELF = [\"我只管报数\", \"我只管记账\", \"我是专门管产量记账的\",\
          \ \"我只负责报数\"]\n\n\ndef main(text, gate_sent, gate_level, gate_target, kb_json)\
          \ -> dict:\n    raw = str(text or \"\")\n    t = raw\n    for p in BAD_PARENS:\n\
          \        t = t.replace(p, \"\")\n    t = re.sub(r\"（[^）]{0,120}(?:农户|内部提示|自我说明|我只管|报数|记账|按规则|规则要求|补充说明|按提示|根据提示|按指令|按格式|默认值|回答依据|回答口径|依据：|备注|口径：)[^）]{0,120}）\"\
          , \"\", t)\n    t = re.sub(r\"（根据(?:用户)?记忆[^）]{0,60}）\", \"\", t)      #\
          \ 整段删掉\"（根据用户记忆中的偏好…）\"\n    t = re.sub(r\"（根据(?:用户)?记忆[，,]\\s*\", \"（\"\
          , t)   # 没写右括号的，只去掉前缀\n    t = t.replace(\"确诊\", \"经农技员确认\")\n    t = t.replace(\"\
          接口\", \"系统\").replace(\"台账\", \"记录\")\n    for s in SELF:\n        t = t.replace(s,\
          \ \"我这边没有这项数据\")\n    # markdown 去壳（模型偶尔不听提示词，这里用代码兜底；统一协议 ⑦ 要求不用 markdown\
          \ 符号）\n    t = re.sub(r\"\\*\\*(.+?)\\*\\*\", r\"\\1\", t, flags=re.S)\n\
          \    t = re.sub(r\"(?m)^\\s{0,3}#{1,6}\\s*\", \"\", t)\n    t = re.sub(r\"\
          (?m)^\\s{0,3}[-*+]\\s+\", \"\", t)\n    # \U0001F534 去编号：整段删掉编号（不能留数字——留成\
          \ \"1 \" 读起来还是清单）；\n    #    必须 (?!\\d) 防误伤小数（\"30.9℃\" 会被旧写法吃成 \"30 9℃\"\
          ）。\n    t = re.sub(r\"(?m)^\\s{0,3}\\d{1,2}[.、)](?!\\d)[ \\t]*\", \"\",\
          \ t)\n    t = t.replace(\"`\", \"\").replace(\"---\", \"\")\n    t = re.sub(r\"\
