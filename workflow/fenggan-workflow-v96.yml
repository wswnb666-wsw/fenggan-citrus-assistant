    - data:
        code: "def main(disease_body, pest_body) -> dict:\n    \"\"\"把两个识别模型的英文结果映射成中文检索词，供知识库检索使用。\"\
          \"\"\n    # ⚠️ 模型返回的是下划线类名（red_spider_mite），历史 MAP 的键是带空格的\n    # → 匹配前统一把\
          \ _ / - 归一成空格，否则虫害**永远匹配不上**\n    s = (str(disease_body) + \" \" + str(pest_body)).lower().replace(\"\
          _\", \" \").replace(\"-\", \" \")\n\n    MAP = [\n    # ---- 病害（新模型 9 类；scab\
          \ 是空位类，保留无害）----\n    (\"healthy\", \"健康\"),\n    (\"greening\", \"黄龙病\"\
          ),\n    (\"canker\", \"溃疡病\"),\n    (\"black spot\", \"黑斑病\"),\n    (\"\
          scab\", \"疮痂病\"),\n    (\"melanose\", \"沙皮病\"),\n    (\"sooty mold\", \"\
          煤烟病\"),\n    (\"anthracnose\", \"炭疽病\"),\n    (\"greasy spot\", \"脂点黄斑病\"\
          ),\n    # ---- 虫害（6 类，具体虫种）----\n    (\"red spider\", \"红蜘蛛\"),\n    (\"\
          spider mite\", \"红蜘蛛\"),\n    (\"psyllid\", \"柑橘木虱\"),\n    (\"aphid\",\
          \ \"蚜虫\"),\n    (\"leafminer\", \"潜叶蛾\"),\n    (\"leaf miner\", \"潜叶蛾\"\
          ),\n    (\"scale insect\", \"蚧壳虫\"),\n    (\"swallowtail\", \"凤蝶\"),\n \
          \   # ---- 兼容旧类名（历史数据里可能还有）----\n    (\"rust mite\", \"锈壁虱\"),\n    (\"\
          whitefly\", \"粉虱\"),\n    (\"thrips\", \"蓟马\"),\n    (\"fruit fly\", \"\
          实蝇\"),\n    (\"white spots\", \"白斑\"),\n    (\"white spot\", \"白斑\"),\n\
          \    (\"others\", \"其他异常\"),\n    (\"pest\", \"虫害\"),\n    ]\n\n    terms\
          \ = []\n    for key, cn in MAP:\n        if key in s and cn not in terms:\n\
          \            terms.append(cn)\n\n    if not terms:\n        terms = [\"\
          柑橘\", \"常见病虫害\"]\n    elif terms == [\"健康\"]:\n        terms = [\"柑橘\",\
          \ \"常见病虫害\"]\n\n    # 病害结果里明确写了 healthy 且没有其它异常时，补上常见病害做兜底\n    if \"healthy\"\
          \ in s and len(terms) == 1 and terms[0] != \"健康\":\n        terms.append(\"\
          健康\")\n\n    return {\"query\": \" \".join(terms) + \" 防治 用药\"}\n\n"
        code_language: python3
