          \ t_q:\n        # 本轮没点名、也没有指代词，却从上游拿到了病虫名 → 极可能是记忆污染，不许猜\n        target,\
          \ tsrc = \"\", \"\"\n    else:\n        target, tsrc = \"\", \"\"\n\n  \
          \  pj, mj = _o(pest_json), _o(med_json)\n    p_ok = str(pj.get(\"code\"\
          )) == \"200\"\n    m_ok = str(mj.get(\"code\")) == \"200\"\n    pd = pj.get(\"\
          data\") if p_ok else None\n    mdd = mj.get(\"data\") if m_ok else None\n\
          \n    # ③ 接口层拿不到数据 → invalid（数据不能作为用药依据）\n    if not p_ok or not isinstance(pd,\
          \ dict):\n        sen = \"当前数据不能作为用药依据，先检查设备或现场确认。\"\n        return _ret(\"\
          invalid\", target, sen, _block(\"invalid\", target, sen,\n             \
          \                                      None, False, False, False, src=tsrc))\n\
          \n    # ④ 目标病虫无法确定 → invalid + 只补一个澄清问题（绝不猜）\n    if not target:\n     \
          \   sen = (\"这句里没有说是哪种病虫，我不能凭这个给用药结论；\"\n               \"先确认是哪一种（比如红蜘蛛、溃疡病），或者直接告诉我病名，我再判断。\"\
          )\n        return _ret(\"invalid\", \"\", sen, _block(\"invalid\", \"\"\
          , sen,\n                                               None, False, False,\
          \ False, src=\"\"))\n\n    # ⑤ 病虫害记录：剔除设备每 10 分钟上报的\"未发现\"噪声\n    rows =\
          \ [x for x in (pd.get(\"list\") or []) if isinstance(x, dict)]\n    noise\
          \ = [x for x in rows if (\"未发现\" in str(x.get(\"hazardName\") or \"\")\n\
          \                                 or \"未发现\" in str(x.get(\"remark\") or\
          \ \"\"))]\n    rows = [x for x in rows if x not in noise]\n\n    ct_g =\
          \ _canon(target)\n    # \U0001F534 v87 R3：实时记录的 hazardName 也归一化后再匹配（目标\"\
          蚧壳虫\" ↔ 记录\"介壳虫\"）\n    tgt = [x for x in rows if ct_g in _canon(str(x.get(\"\
          hazardName\") or \"\"))]\n    others = sorted({str(x.get(\"hazardName\"\
          )) for x in rows\n                     if ct_g not in _canon(str(x.get(\"\
          hazardName\") or \"\")) and x.get(\"hazardName\")})\n\n    recent, older,\
          \ badtime = [], [], []\n    for x in tgt:\n        dt = _dt(x.get(\"recordTime\"\
          ))\n        if dt is None:\n            badtime.append(x)              \
          \        # 时间戳无法识别\n            continue\n        delta = (_NOW - dt).days\n\
          \        if delta < 0:\n            badtime.append(x)                  \
          \    # \U0001F534 v86 P0-2：未来时间戳，不得当实时证据\n        elif delta <= REAL_DAYS:\n\
          \            recent.append(x)\n        else:\n            older.append(x)\n\
          \n    counts = [(_num(x.get(\"remark\")), str(x.get(\"recordTime\"))[:16])\
