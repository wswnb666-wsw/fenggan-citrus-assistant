    - data:
        code: "import json\n\n# 关键字 -> 中文检索词（与工作流现有【拼装检索词】同一套口径）\n# ✅ App 本地模型已升级：9\
          \ 类病害 + 6 类虫害（虫害是**具体虫种**）。\n#    识别结果里还会直接带中文 name 字段，下面优先采信。\nMAP = [\n\
          # ---- 病害（新模型 9 类；scab 是空位类，保留无害）----\n(\"healthy\", \"健康\"),\n(\"greening\"\
          , \"黄龙病\"),\n(\"canker\", \"溃疡病\"),\n(\"black spot\", \"黑斑病\"),\n(\"scab\"\
          , \"疮痂病\"),\n(\"melanose\", \"沙皮病\"),\n(\"sooty mold\", \"煤烟病\"),\n(\"anthracnose\"\
          , \"炭疽病\"),\n(\"greasy spot\", \"脂点黄斑病\"),\n# ---- 虫害（6 类，具体虫种）----\n(\"\
          red spider\", \"红蜘蛛\"),\n(\"spider mite\", \"红蜘蛛\"),\n(\"psyllid\", \"柑橘木虱\"\
          ),\n(\"aphid\", \"蚜虫\"),\n(\"leafminer\", \"潜叶蛾\"),\n(\"leaf miner\", \"\
          潜叶蛾\"),\n(\"scale insect\", \"蚧壳虫\"),\n(\"swallowtail\", \"凤蝶\"),\n# ----\
          \ 兼容旧类名（历史数据里可能还有）----\n(\"rust mite\", \"锈壁虱\"),\n(\"whitefly\", \"粉虱\"\
          ),\n(\"thrips\", \"蓟马\"),\n(\"fruit fly\", \"实蝇\"),\n(\"white spots\", \"\
          白斑\"),\n(\"white spot\", \"白斑\"),\n(\"others\", \"其他异常\"),\n(\"pest\", \"\
          虫害\"),\n]\n\n\ndef _collect_names(obj):\n    \"\"\"递归抠出所有 name 字段（App 新链路会直接给中文病名/虫名）。\"\
          \"\"\n    out = []\n\n    def walk(o):\n        if isinstance(o, dict):\n\
          \            n = o.get(\"name\")\n            if isinstance(n, str) and\
          \ n.strip():\n                out.append(n.strip())\n            for v in\
          \ o.values():\n                walk(v)\n        elif isinstance(o, list):\n\
          \            for v in o:\n                walk(v)\n\n    try:\n        walk(json.loads(str(obj)))\n\
          \    except Exception:\n        pass\n    return out\n\n\ndef _norm(x):\n\
          \    if x is None:\n        return \"\"\n    if isinstance(x, str):\n  \
          \      return x.strip()\n    try:\n        return json.dumps(x, ensure_ascii=False)\n\
          \    except Exception:\n        return str(x)\n\n\ndef main(detect_result)\
          \ -> dict:\n    text = _norm(detect_result)\n    # ⚠️ 归一化：模型类名带下划线（greasy_spot），MAP\
          \ 键带空格\n    s = text.lower().replace(\"_\", \" \").replace(\"-\", \" \"\
          )\n\n    # ① 先用返回里自带的中文 name（最准）\n    terms = []\n    for n in _collect_names(text):\n\
          \        if n not in terms:\n            terms.append(n)\n    # ② 再用关键字表补（兼容没有\
          \ name 的旧载荷）\n    for key, cn in MAP:\n        if key in s and cn not in\
          \ terms:\n            terms.append(cn)\n\n    if not terms:\n        terms\
          \ = [\"柑橘\", \"常见病虫害\"]\n    if \"healthy\" in s and len(terms) == 1 and\
          \ terms[0] != \"健康\":\n        terms.append(\"健康\")\n\n    return {\n  \
          \      \"detect_result\": text,\n        \"query\": \" \".join(terms) +\
          \ \" 防治 用药\",\n    }\n"
        code_language: python3
