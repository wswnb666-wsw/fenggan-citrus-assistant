          lastTime\"), _ago(sm.get(\"lastTime\"), base))]\n    rows = []\n    for\
          \ x in (d.get(\"list\") or [])[:5]:\n        if isinstance(x, dict):\n \
          \           rows.append(\"%s %s %s %s 间隔%s天\" % (str(x.get(\"workTime\"\
          ) or \"\")[:16], x.get(\"pestName\"),\n                                \
