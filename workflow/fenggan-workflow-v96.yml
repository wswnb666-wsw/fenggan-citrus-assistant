    - data:
        code: "import re as _re\n# -*- coding: utf-8 -*-\n\"\"\"证据门：用药决策（确定性 Code\
          \ 节点）。\n输出 decision_level = strong / insufficient / invalid + 必须照抄的口径句。\n\
          原则：能不能打药由代码定；LLM 只许把结论说成人话，不许升级。\n2026-09-28 补丁：target_pest 优先取「本轮用户原话」里的病虫名（raw），\n\
          \  本轮没点名时才允许用改写结果做「指代继承」；两条都不成立 → invalid + 只补一个澄清问题（绝不猜）。\n\"\"\"\nimport\
          \ json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\n\
          _NOW = (datetime.now(timezone.utc) + timedelta(hours=8)).replace(tzinfo=None)\n\
          \nPEST = [\"溃疡病\", \"黄龙病\", \"炭疽病\", \"疮痂病\", \"黑斑病\", \"树脂病\", \"流胶病\"\
          ,\n        \"脚腐病\", \"煤烟病\", \"砂皮病\", \"脂点黄斑病\", \"疫病\", \"青霉病\", \"绿霉病\"\
          ,\n        \"红蜘蛛\", \"蚜虫\", \"潜叶蛾\", \"蚧壳虫\", \"粉虱\", \"蓟马\", \"实蝇\",\n\
          \        \"凤蝶\", \"锈壁虱\", \"木虱\", \"天牛\", \"卷叶蛾\", \"蝽\", \"螨\", \"蜗牛\"\
          ,\n        \"线虫\", \"地老虎\", \"金龟子\", \"象甲\", \"螟\", \"白粉虱\"]\n\n# \U0001F534\
          \ 执行决策意图：农户想知道\"现在要不要动手\"\nDECIDE = [\"要不要打药\", \"要不要先打\", \"要不要用药\", \"\
          要不要喷药\", \"要不要打一遍\", \"要不要马上打\",\n          \"该不该打药\", \"需不需要打药\", \"需不需要用药\"\
          , \"用不用打药\", \"打不打药\", \"要不要打点药\",\n          \"要不要治\", \"该不该治\", \"要不要处理\"\
          , \"该不该处理\", \"需不需要处理\",\n          \"要不要防\", \"该不该防\", \"要不要喷\", \"能不能打药\"\
          , \"可以打药吗\", \"现在要打药吗\", \"需不需要防\",\n          # \U0001F534 v83（md「v82 P0\
          \ 决策词表一致性」）：补齐\"前置路由已认定为执行决策、但门内不认\"的口语说法。\n          #    匹配用 `d in q`（子串）⇒\
          \ \"要不要打\" 同时覆盖 \"要不要打一遍 / 要不要打点药\" 这类更长说法。\n          \"要不要打\", \"该不该打\"\
          , \"能不能打\", \"先打药还是\",\n          \"适不适合喷药\", \"是否需要用药\", \"用药合不合适\"]\n\n\
          # 纯知识/记录型（出现这些就不是\"当下执行决策\"，交给原分支）\nKNOW = [\"怎么防\", \"怎么防治\", \"防治方法\"\
          , \"用什么药\", \"打什么药\", \"怎么治\", \"如何治\",\n        \"多久\", \"间隔期\", \"安全间隔\"\
          , \"几次\", \"记录\", \"打过什么药\", \"用过什么药\", \"稀释\", \"多少倍\"]\n\n# \U0001F534\
          \ 指代词：本轮用户没点名病虫、只用\"那个/它\"指代时，才允许从上一轮上下文继承对象\nANAPH = [\"那个\", \"这个\", \"\
          那种\", \"这种\", \"它\", \"刚才\", \"上次\", \"上面说\", \"前面说\", \"该虫\", \"这虫\"]\n\
          \nREAL_DAYS = 7       # 近 N 天算\"实时证据\"\nSTRONG_MIN = 3      # \U0001F534\
          \ 保守阈值：设备识别数量 >= 3 才够\"可靠实时证据\"（可调）\n\n\ndef _o(s):\n    try:\n        x\
          \ = json.loads(s) if isinstance(s, str) else s\n    except Exception:\n\
          \        return {}\n    return x if isinstance(x, dict) else {}\n\n\ndef\
          \ _pest_in(q):\n    # \U0001F534 v87 R3：用户原话/改写问题也走别名归一化（\"沙皮病要不要打药\"要能识别成\"\
