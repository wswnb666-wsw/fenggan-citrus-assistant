          却没点名是哪种病虫 → 交给多意图分支的证据门，\n        #   由它确定性给出\"对象不明、不能作为用药依据\"的口径，绝不让分类器自由发挥。\n\
          \        route, hit = \"multi\", \"用药决策·对象待确认\"\n    elif sf_hit:\n    \
