          , \"pest\", \"med\", \"pheno\", \"yield\", \"sale\"}\n    gen_multi = (len(_dgrp)\
          \ >= 2 and _sep) or (bool(_cgrp) and _caution)\n    pn_hit = [p for p in\
          \ PEST_OBJ if p in q]\n    pnow_hit = [p for p in PEST_NOW if p in q]\n\
          \    pnow_time = [p for p in PEST_NOW_TIME if p in q]\n    pdec_hit = [p\
          \ for p in PEST_DECIDE if p in q or p in rq]\n    # “木虱多，是不是红蜘蛛也多？”：没有“现在/多不多”字样，但问的就是现状；\n\
          \    # 漏掉它 → 这类“拿 A 证明 B”的问法会落到记录分支，答不出“不能据此判断”\n    _cmp2 = (len(pn_hit)\
          \ >= 2 and any(w in q for w in (\"是不是\", \"会不会\"))\n             and any(w\
          \ in q for w in (\"多\", \"少\", \"严重\", \"厉害\")))\n    _pn_ok = bool(pn_hit)\
          \ and bool(pnow_hit) and bool(pnow_time or (pnow_hit and not s_hit))\n \
          \   # 2026-09-28（P1-3）：农户明确在问\"要不要浇水\"时，只要其它意图里**只有\"环境读数\"**，\n    #  \
          \ 就直接走浇水分支（这条路上才有 实时快照 + 土壤水分趋势 + 浇水建议强度门）。\n    #   还有别的意图（病虫/农事/产量…）时不算，仍然走多意图。\n\
          \    _wn = _dgrp - {\"env\", \"water\"}\n    # 2026-09-28（P0-1 补丁）：只提病虫名的短问句（\"\
          红蜘蛛呢？\"）——本轮原话里有病虫名就算，\n    #   别因为\"问题改写\"被记忆污染（把溃疡病写进来）就丢掉这条规则。\n    _BLKQ\
