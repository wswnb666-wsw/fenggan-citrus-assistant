    - data:
        code: "import json\n\nIMG_BASE = \"https://47-120-32-59.sslip.io\"  # 后端公网基址；以后有固定\
          \ HTTPS 域名只改这一行\n\n\ndef _load(x):\n    \"\"\"HTTP 节点的 body 是字符串，兼容已经是 dict\
          \ 的情况。\"\"\"\n    if isinstance(x, dict):\n        return x\n    try:\n\
          \        return json.loads(str(x))\n    except Exception:\n        return\
          \ {}\n\n\ndef _pick_image(root, prefer=None):\n    \"\"\"从某个识别接口的返回里抠带框图地址；没有就返回空串。\n\
          \    - 病害接口(8000)：annotatedUrl 在【顶层】，data 是数组；无检出时为 None/缺省\n    - 虫害接口(8080)：annotatedUrl\
          \ 在 data 里（dict）；status=empty 时整个键不存在\n    \"\"\"\n    root = root or {}\n\
          \    # 新 8000 返回顶层有 annotatedUrls={disease,pest}，比单张 annotatedUrl 更准\n \
          \   urls = root.get(\"annotatedUrls\") or {}\n    rel = \"\"\n    if prefer\
          \ and isinstance(urls, dict) and urls.get(prefer):\n        rel = urls[prefer]\n\
          \    if not rel:\n        rel = root.get(\"annotatedUrl\") or \"\"\n   \
          \ if not rel:\n        d = root.get(\"data\")\n        if isinstance(d,\
          \ dict):\n            rel = d.get(\"annotatedUrl\") or \"\"\n        elif\
          \ isinstance(d, list):\n            for it in d:\n                if isinstance(it,\
          \ dict) and it.get(\"annotatedUrl\"):\n                    rel = it[\"annotatedUrl\"\
          ]\n                    break\n    if not rel:\n        return \"\"\n   \
          \ if rel.startswith(\"http\"):\n        return rel\n    return IMG_BASE\
          \ + rel\n\n\ndef main(pest_body, disease_body) -> dict:\n    \"\"\"病害、虫害谁的带框图来了都拼成\
          \ markdown 图片，可能 1 张也可能 2 张。\"\"\"\n    imgs = []\n    for body, pref in\
          \ ((disease_body, \"disease\"), (pest_body, \"pest\")):\n        u = _pick_image(_load(body),\
          \ prefer=pref)\n        if u and u not in imgs:\n            imgs.append(u)\n\
          \n    image_md = \"\".join(\"![识别结果](\" + u + \")\\n\" for u in imgs)\n\
          \    return {\n        \"image_md\": image_md,\n        \"annotated_url\"\
          : imgs[0] if imgs else \"\",\n        \"has_image\": \"1\" if imgs else\
          \ \"0\",\n    }\n"
        code_language: python3
        desc: 虫害接口 annotatedUrl 拼 https 前缀；status=empty 时输出空，避免裂图
        outputs:
          annotated_url:
            children: null
            type: string
          has_image:
            children: null
            type: string
          image_md:
            children: null
            type: string
        selected: false
        title: 拼图片地址
