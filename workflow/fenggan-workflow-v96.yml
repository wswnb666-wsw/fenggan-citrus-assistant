          \ c in [x for x in _TURN2.split(s) if x.strip()]:\n            # 安全条件式：核实动作\
          \ + 决策待定 + 无直接执行 → 保留\n            safe_cond = ((_INSPECT2.search(c) or\
          \ ctx_inspect)\n                         and _DECIDE_PENDING.search(c)\n\
          \                         and not _DIRECT_EXEC.search(c))\n            if\
          \ _EXEC2.search(c) and not safe_cond:\n                # 含执行动作：即使有否定词也删（收窄豁免的核心）\n\
