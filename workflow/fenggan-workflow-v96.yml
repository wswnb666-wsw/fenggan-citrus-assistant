    - data:
        code: "# 确定性设备自检：只报\"读数是否异常\"，不做任何业务推断。\n# \U0001F534 v90（P1-1）：三态语义 + 时间戳\
          \ + 按设备隔离。\n#   修复前的问题（路线图 P1-1）：\n#   ① 解析失败/结构异常 → 返回 abnormal=\"0\"（等于\"\
          确认正常\"）✗ ——\"无法判断\"必须单独表示；\n#   ② 完全没有解析 recordTime ✗（提示词却要求模型说\"超过 6 小时可能离线\"\
          ）；\n#   ③ 没有按 deviceNum 隔离 ✗（同一 digitalName 混多台设备时互相污染）；\n#   ④ 取每组的**第一个值**（v[0]）✗\
          \ —— 接口乱序时会拿旧值当现状；\n#   ⑤ 诊断文本与真正执行的判断不完全一致。\n#   现在：输出 finding + abnormal\
          \ + **checkable** 三件套；\n#        checkable=\"0\" 表示\"数据不足/无法完成检查\"（任何下游都不许当\"\
          正常\"用）。\nimport json\nimport re\nfrom datetime import datetime, timedelta,\
          \ timezone\n\n# \U0001F534 时区：Dify 代码节点沙箱是 UTC —— 直接用 datetime.now() 会把北京时间读数判成\"\
          未来 8 小时\"。\n#    本园数据全部是北京时间（Asia/Shanghai, UTC+8），统一换算后再比较。\n_CST = timezone(timedelta(hours=8))\n\
          \n\ndef _now_cst():\n    return datetime.now(timezone.utc).astimezone(_CST).replace(tzinfo=None)\n\
          \n\ndef _f(x):\n    try:\n        return float(str(x).strip())\n    except\
          \ Exception:\n        return None\n\n\n_TIME_FORMATS = (\"%Y-%m-%d %H:%M:%S\"\
          , \"%Y-%m-%d %H:%M\", \"%Y/%m/%d %H:%M:%S\", \"%Y/%m/%d %H:%M\")\n\n\ndef\
          \ _parse_time(s):\n    t = str(s or \"\").strip()\n    if not t:\n     \
          \   return None\n    t = t.replace(\"T\", \" \").split(\".\")[0]\n    for\
          \ f in _TIME_FORMATS:\n        try:\n            return datetime.strptime(t,\
          \ f)\n        except Exception:\n            continue\n    return None\n\
          \n\ndef main(body) -> dict:\n    \"\"\"三态输出：\n    checkable=0          \
          \            → 数据不足/结构异常，无法判断（不是\"正常\"）\n    checkable=1 且 abnormal=0  \
          \      → 未发现已定义异常\n    checkable=1 且 abnormal=1        → 发现明确异常（finding\
          \ 里逐条列出）\n    \"\"\"\n    try:\n        j = json.loads(str(body))\n    except\
          \ Exception:\n        return {\"finding\": \"本轮实时数据没有解析成功，无法判断设备状态。\",\n\
          \                \"abnormal\": \"0\", \"checkable\": \"0\"}\n    rows =\
          \ j.get(\"data\") if isinstance(j, dict) else j\n    if not isinstance(rows,\
          \ list) or not rows:\n        return {\"finding\": \"本轮没有拿到逐点读数，无法判断设备状态。\"\
          ,\n                \"abnormal\": \"0\", \"checkable\": \"0\"}\n    rows\
          \ = [r for r in rows if isinstance(r, dict)]\n    if not rows:\n       \
          \ return {\"finding\": \"本轮数据里没有可用的读数行，无法判断设备状态。\",\n                \"\
          abnormal\": \"0\", \"checkable\": \"0\"}\n\n    # ① 按 (digitalName, deviceNum)\
          \ 分组：同名字段但不同设备必须分开（防互相污染）\n    by = {}\n    for r in rows:\n        k =\
          \ str(r.get(\"digitalName\") or \"\").strip()\n        dn = str(r.get(\"\
          deviceNum\") or \"\").strip()\n        if not k:\n            continue\n\
          \        by.setdefault((k, dn), []).append(r)\n    if not by:\n        return\
          \ {\"finding\": \"本轮读数缺少测点名称，无法判断设备状态。\",\n                \"abnormal\"\
          : \"0\", \"checkable\": \"0\"}\n\n    # ② 时间戳：每组取最新记录的 recordTime（乱序安全：按解析后的时间比较）\n\
          \    now = _now_cst()          # 北京时间，不用沙箱的 UTC\n    notes = []\n    latest_overall\
          \ = None\n    no_ts, bad_ts, future_ts = [], [], []\n    for (k, dn), rs\
          \ in by.items():\n        best = None\n        for r in rs:\n          \
          \  dt = _parse_time(r.get(\"recordTime\") or r.get(\"record_time\") or r.get(\"\
          time\"))\n            if dt is None:\n                continue\n       \
          \     if best is None or dt > best:\n                best = dt\n       \
          \ if best is None:\n            no_ts.append(\"%s%s\" % (k, \"/\" + dn if\
          \ dn else \"\"))\n            continue\n        if best > now + timedelta(minutes=5):\n\
          \            future_ts.append(k)\n        if latest_overall is None or best\
          \ > latest_overall:\n            latest_overall = best\n    if future_ts:\n\
          \        notes.append(\"有读数的时间戳在未来（%s），不能当作实时数据\" % \"、\".join(sorted(set(future_ts))[:3]))\n\
          \    if no_ts and latest_overall is None:\n        # 所有组都没有可解析时间戳 → 无法判断新鲜度\n\
          \        return {\"finding\": \"本轮读数都没有可用的时间戳，无法判断数据新鲜度与设备状态。\",\n     \
          \           \"abnormal\": \"0\", \"checkable\": \"0\"}\n    if latest_overall\
          \ is not None:\n        hours = (now - latest_overall).total_seconds() /\
          \ 3600.0\n        if hours >= 6:\n            notes.append(\"最近一次读数已是 %.1f\
          \ 小时前（超过 6 小时，疑似设备离线或未上报）\" % hours)\n\n    # ③ 数值类检查（每组的**最新一条**参与，不再取\
          \ v[0]）\n    def _latest_val(rs):\n        best, val = None, None\n    \
          \    for r in rs:\n            dt = _parse_time(r.get(\"recordTime\") or\
          \ r.get(\"record_time\") or r.get(\"time\"))\n            if dt is not None\
          \ and (best is None or dt > best):\n                best, val = dt, r.get(\"\
          digital\")\n        if best is None:                      # 没有时间戳时退回最后一条，并记注明\n\
          \            val = rs[-1].get(\"digital\") if rs else None\n        return\
          \ _f(val)\n\n    ph = [_latest_val(rs) for (k, _), rs in by.items() if k.upper().startswith(\"\
          PH\")]\n    ph = [x for x in ph if x is not None]\n    if len(ph) >= 2 and\
          \ all(abs(x - 7.0) < 1e-6 for x in ph):\n        notes.append(\"PH 各点都等于\
          \ 7.0（疑似没测到真实值，不要当成真实酸碱度播报）\")\n    hum = [_latest_val(rs) for (k, _), rs\
          \ in by.items() if \"湿度\" in k]\n    hum = [x for x in hum if x is not None]\n\
          \    if hum and all(abs(x) < 1e-6 for x in hum):\n        notes.append(\"\
          湿度各点都是 0.00（疑似探头故障）\")\n    temps = [_latest_val(rs) for (k, _), rs in by.items()\
          \ if \"温度\" in k]\n    tvals = [t for t in temps if t is not None]\n   \
          \ if len(tvals) >= 2 and (max(tvals) - min(tvals)) >= 15:\n        notes.append(\"\
          温度点之间相差 %.1f℃（超过 15℃，疑似离群或故障）\" % (max(tvals) - min(tvals)))\n    cnt =\
          \ {k: len(rs) for (k, _), rs in by.items()}\n    if cnt:\n        lo, hi\
          \ = min(cnt.values()), max(cnt.values())\n        if hi >= 6 and hi >= lo\
          \ * 3:\n            notes.append(\"有探头采样点明显少于其它（疑似掉线）\")\n\n    # ④ 三态收口：\n\
          \    #    checkable=1（能算）＋ abnormal 只反映\"发现的明确异常\"；\n    #    \"样本少/时间戳不全\"\
          这类属于**结论强度提示**（caveat），append 到 finding 但不算异常。\n    checkable = \"1\"\n\
          \    caveats = []\n    if len(rows) < 3:\n        caveats.append(\"本轮样本数很少（%d\
          \ 条），结论仅供参考\" % len(rows))\n    if no_ts:\n        caveats.append(\"有 %d\
          \ 个测点缺少可解析的时间戳\" % len(no_ts))\n    _find = \"；\".join(notes) if notes else\
          \ \"本次读数未发现明显设备异常\"\n    if caveats:\n        _find = _find + \"（\" + \"\
          ；\".join(caveats) + \"）\"\n    return {\"finding\": _find,\n           \
          \ \"abnormal\": \"1\" if notes else \"0\",\n            \"checkable\": checkable}\n"
        code_language: python3
