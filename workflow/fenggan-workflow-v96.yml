          [ \\t]+\\n\", \"\\n\", t)\n    # \U0001F534 空回答保护（v74 P0-2）：LLM 偶发返回空 →\
          \ 这里给按业务类型的确定性兜底，\n    #    用户绝不会看到空白 / None。\n    is_empty = not _src.strip()\n\
          \    if is_empty:\n        t = '这次回答没有成功生成，建议重新问一次。'\n    t = t.strip()\n\
          \    t, _decide = _img_gate(t, raw)\n    t = t.strip()\n    return {\"text\"\
          : t, \"decide\": _decide, \"changed\": \"1\" if t != _src.strip() else \"\
          0\",\n            \"empty\": \"1\" if is_empty else \"0\"}\n\n\n# ============================================================================\n\
          # \U0001F534 v94（图片分支清洗 · 任务单《图片分支执行建议漏放与清洗残句修复》）\nimport re as _re2\n#\
          \   修复前实测（复现记录在案）：A 组 2/8 失败 ——\n#     A1「当前没有实时虫量，可是先巡查确认后可以用药。」→ \"可以用药\"\
          \ 被 _SAFE 里的\n#        \"先巡查\" 整句豁免 ✗（安全词豁免执行动作）；\n#     A4「现在能否施药？…」→ 根本没进安全流程\
          \ ✗（决策词表缺\"施药\"）。\n#   本版四件事：\n#   ① 决策识别补执行动词（含\"施药\"），与主链路词表统一口径；\n# \
          \  ② **收窄安全词豁免**：否定/事实词只能豁免\"没有执行动作\"的子句；\n#      安全条件式 = 有核实动作（先巡查/先确认/先检查/核实…）**且**\
          \ 有决策待定语义\n#      （是否/要不要/需不需要/再决定/再判断）**且** 无直接执行措辞 —— 三者同时成立才保留；\n#  \
          \ ③ **残句收口**：让步从句（虽然/尽管…）丢弃、悬空转折词（但是/反而/同时…）清理、\n#      句末补句号、正文为空时给静态安全兜底句（不由模型自由补写）；\n\
          #   ④ raw 缺失/为空 → 按保守处理（仍套安全口径），绝不因缺原话而放行执行建议。\n#   ⚠️ 只动这两个图片清洗节点；不动阈值/主干/其它清洗节点/接口配置。\n\
          # ============================================================================\n\
          # \U0001F534 v96（复审 P0）：两线判据 + **动作前置模式** + 知识框架否决。修两处实测缺陷：\n#   ①「红蜘蛛施药是否合适？」→\
          \ 旧版漏判（识别只覆盖\"决策词在前、动作在后\"）；\n#   ②「红蜘蛛应该怎么防治？」→ 旧版误判（\"该 + 防治\" 命中，但这是纯知识问句）。\n\
          _A_WORDS = (\"要不要|该不该|需不需要|用不用|打不打|能不能|能否|是不是|是否|适不适合|适合\"\n           \
          \ \"|可不可以|可以不可以|是否可以\")\n_B_WORDS = \"可以|能|需要|该|要|合适|应当|应该\"\n_V_WORDS =\
          \ \"防治|防控|用药|施药|打药|喷药|喷施|喷雾|打一遍|喷一遍|处理|治|防|打\"\n_T_WORDS = \"现在|今天|当前|马上|立刻|直接|先\"\
          \n_FRAME_WORDS = (\"怎么|如何|哪些|哪种|有什么|什么|介绍|讲讲|发生规律|危害|特征|症状|识别|区别\"\n   \
          \             \"|多久|间隔期|安全间隔|稀释|倍数|什么时候|何时|以后|未来|一般|通常|如果|假如|为什么\")\n# 一线：决策/许可词在前\
          \ + 执行动作在后（强信号，不设知识排除）\n_A_RE = _re2.compile(r\"(%s)[^。？！；;，,\\n]{0,6}(%s)\"\
          \ % (_A_WORDS, _V_WORDS))\n# 二线：**动作在前、决策词在后**（修「施药是否合适」）\n_REV_RE = _re2.compile(r\"\
          (%s)[^。？！；;，,\\n]{0,4}\"\n                       r\"(是否|合适|可以吗|可以么|行吗|行不行|好不好|能吗|要得不\"\
          \n                       r\"|能不能|要不要|该不该|需不需要|适不适合)\" % _V_WORDS)\n# 三线：弱决策词\
          \ + 执行动作 —— 需\"当前语境\"或\"无知识框架词\"\n_B_RE = _re2.compile(r\"(%s)[^。？！；;，,\\\
          n]{0,6}(%s)\" % (_B_WORDS, _V_WORDS))\n_T_RE2 = _re2.compile(_T_WORDS)\n\
          _FRAME_RE2 = _re2.compile(_FRAME_WORDS)\n\n# 肯定性执行动作（要删）：执行动词，或\"动词+药/倍\"\
          的具体用药句\n_EXEC2 = _re2.compile(\n    r\"(建议|可以|可|应该|应当|适合|宜|抓紧|尽快|赶紧|及时|直接|现在|马上|立即|不妨|最好|须|需要|考虑|选用\"\
          \n    r\"|采取|开展|进行|实施)\"\n    r\"[^。！？；\\n]{0,14}?(补防|补打|补药|轮换|备药|备货|用药|打药|喷药|施药|喷施|防治|打一遍|喷一遍)\"\
          \n    r\"|(可以|建议|能|宜|不妨)[^。！？；\\n]{0,8}?再打\"\n    r\"|补防|轮换用药|安排用药|安排防治|安排喷药\"\
          \n    r\"|(建议|可以|应当|应该|马上|立即|直接|最好)[^。！？；\\n]{0,8}(用|喷|打|选)[^。！？；\\n]{0,12}?\"\
          \n    r\"(倍|稀释|药液|悬浮剂|乳油|粉剂|粒剂|水分散)\")\n\n# 否定/事实/待定（只能保护\"没有执行动作\"的子句；不再保护含执行动作的句子）\n\
          _SAFE2 = _re2.compile(\n    r\"没有|没|不能|不可以|不可|不得|不许|不该|不要|不需要|不必|不宜|不建议|禁止|暂不|尚未|还没|暂无\"\
          \n    r\"|无需|避免|甭|并非|不是\"\n    r\"|未(达标|满|到|出现|发现|记录|能|见|曾)\"\n    r\"|无(补防|轮换|用药|打药|喷药|施药|备药|防治|异常|病|虫)\"\
          \n    r\"|是否|要不要|需不需要|再决定|再判断|再评估\")\n_INSPECT2 = _re2.compile(r\"先(巡查|确认|检查|看|查看|观察|查|摸|核实|判断)|核实(后|再|了|一下)|确认(后|再|了)|检查(后|再)\"\
          )\n_DECIDE_PENDING = _re2.compile(r\"是否|要不要|需不需要|再决定|再判断|再评估|再考虑\")\n_DIRECT_EXEC\
          \ = _re2.compile(r\"(就|立即|马上|直接|即可|赶紧|赶快|尽快|抓紧|及时)[^。！？；\\n]{0,6}\"\n  \
          \                          r\"(可以|能|要|需|该)?[^。！？；\\n]{0,4}\"\n         \
          \                   r\"(用药|打药|喷药|施药|喷施|补防|补打|防治|轮换)\")\n_TURN2 = _re2.compile(r\"\
          (?<=[，,；;])|(?<!不)(?=但|不过|然而|只是|另外|却|可是|反而|同时)\")\n_CONCESS2 = _re2.compile(r\"\
          ^(虽然|尽管|即使|就算)\")\n_DANGLING = (\"但是\", \"可是\", \"反而\", \"同时\", \"不过\",\
          \ \"然而\", \"只是\", \"另外\", \"却\", \"而且\", \"并且\")\n\nIMG_GATE_SENT = (\"\
          仅凭这张图片不能确认本园当前虫情是否达到用药条件，请先核实现场虫情，\"\n                 \"再依据有效记录、农药标签和安全间隔期判断是否需要用药。\"\
          )\nIMG_SAFE_FALLBACK = \"建议先核实现场虫情，再结合有效记录、农药标签和安全间隔期判断是否需要用药。\"\n\n\ndef\
          \ _is_decide_q2(q):\n    \"\"\"分句级三线判据：一线/二线命中即判决策（不看知识词）；三线需当前语境或不含知识框架词。\n\
          \    raw 缺失/为空 → 保守：按执行决策处理（不得因缺原话放行执行建议）。\"\"\"\n    s = str(q or \"\"\
          )\n    if not s.strip():\n        return True\n    for c in _re2.split(r\"\
          [。？！；;，,\\n]\", s):\n        c = c.strip()\n        if not c:\n        \
          \    continue\n        if _A_RE.search(c) or _REV_RE.search(c):\n      \
          \      return True\n        if _B_RE.search(c) and (_T_RE2.search(c) or\
          \ not _FRAME_RE2.search(c)):\n            return True\n    return False\n\
          \n\ndef _img_gate(t, raw):\n    \"\"\"执行决策场景 → 安全口径句置顶 + 收窄豁免的逐子句过滤 + 残句收口。\n\
          \    返回 (新文本, 是否决策)。\"\"\"\n    if not _is_decide_q2(raw):\n        return\
          \ t, \"0\"\n    t = str(t or \"\").strip()\n    if not t:\n        return\
          \ IMG_GATE_SENT, \"1\"\n    if not t.startswith(IMG_GATE_SENT):\n      \
          \  t = (IMG_GATE_SENT + \"\\n\" + t).strip()\n    rest = t[len(IMG_GATE_SENT):].strip()\n\
          \    if not rest:\n        return IMG_GATE_SENT, \"1\"\n    kept_sents =\
          \ []\n    for s in [x for x in _re2.split(r\"(?<=[。！？；\\n])\", rest) if\
          \ x.strip()]:\n        kept = []\n        ctx_inspect = False\n        for\
          \ c in [x for x in _TURN2.split(s) if x.strip()]:\n            # 安全条件式：核实动作\
          \ + 决策待定 + 无直接执行 → 保留\n            safe_cond = ((_INSPECT2.search(c) or\
          \ ctx_inspect)\n                         and _DECIDE_PENDING.search(c)\n\
          \                         and not _DIRECT_EXEC.search(c))\n            if\
          \ _EXEC2.search(c) and not safe_cond:\n                # 含执行动作：即使有否定词也删（收窄豁免的核心）\n\
          \                if _SAFE2.search(c) and not _EXEC2.search(c):\n       \
          \             kept.append(c)\n                continue\n            if _SAFE2.search(c):\n\
          \                kept.append(c)\n                continue\n            if\
          \ _INSPECT2.search(c):\n                ctx_inspect = True\n           \
          \ kept.append(c)\n        if not kept:\n            continue\n        #\
          \ 残句收口 ①：只剩让步从句 → 丢弃\n        if len(kept) == 1 and _CONCESS2.match(kept[0].strip()):\n\
          \            continue\n        j = \"\".join(kept).rstrip()\n        while\
          \ j and j[-1] in \"，,、；; \":\n            j = j[:-1]\n        # 残句收口 ②：结尾悬空转折词\
          \ → 去掉\n        for d_ in _DANGLING:\n            if j.endswith(d_):\n \
          \               j = j[: -len(d_)]\n        if j and s.rstrip().endswith((\"\
          。\", \"！\", \"？\")) and not j.endswith((\"。\", \"！\", \"？\")):\n       \
          \     j += \"。\"\n        if j.strip():\n            kept_sents.append(j.strip())\n\
          \    body = \"\".join(kept_sents).strip()\n    # 残句收口 ③：正文为空或只剩让步/悬空片段 →\
          \ 静态安全兜底句（不由模型补写）\n    if not body or _CONCESS2.match(body):\n        body\
          \ = IMG_SAFE_FALLBACK\n    out = (IMG_GATE_SENT + \"\\n\" + body).strip()\n\
          \    return out, \"1\"\n"
