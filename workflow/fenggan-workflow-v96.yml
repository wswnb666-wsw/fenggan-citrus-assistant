        code: "import re as _re\n# 确定性前置规则：只有「点名的病虫害 + 明确处置意图」才直接走病虫害处置分支。\n# 目的：修「溃疡病该怎么处理」被判成\"\
          产量查询\"这类偶发误判。\n# \U0001F534 2026-09-28（v74 P0-1 第二轮）：本节点命中后会**越过**「前置路由」直接进普通防治知识分支，\n\
          #    所以必须收紧三条：\n#    ① 处置意图必须出现在**用户本轮原话**里 —— 不许由\"问题改写\"自己补出\"防治\"，\n\
          #       否则「红蜘蛛呢？」会被改写成「红蜘蛛的防治措施是什么？」，然后被当成知识问答（实测事故）；\n#    ② 用户原话里是「要不要打药\
          \ / 该不该防 / 要不要处理」这类**执行决策**问题 → 不命中，\n#       交给前置路由 → 多意图分支（那里挂了证据门），不许直接给防治方案；\n\
          #    ③ 原话里没有任何处置意图（只是提了个病虫名，问现状）→ 不命中 → 交给路由走虫情现状。\n#\n# \U0001F534 2026-10-09（v89\
          \ P0-1 第三轮）：DECIDE 是**枚举**，覆盖不了句式变体 ——\n#    实测漏网 3 例：「红蜘蛛可以安排防治吗？/ 红蜘蛛是否需要安排防治？/\
          \ 红蜘蛛现在可以防治吗？」\n#    （都带\"防治\"拿到 intent，但变体不在 DECIDE 里，于是被抢进普通防治知识分支）。\n\
          #    修法：增加**决策结构识别** `_DECIDE_RE`（决策词 + 执行动词），并加知识标记排除表 `_KNOW_RE`\n#  \
          \  （含\"怎么/如何/哪些/什么/介绍/发生规律…\"判为知识查询，照旧走知识分支，不误伤）。\n#    ⚠️ 只放宽\"识别为决策\"\
          的形态，不放宽任何安全门槛。\n\nimport re as _re\n\nPEST = [\n    \"溃疡病\", \"黄龙病\", \"\
          炭疽病\", \"疮痂病\", \"黑斑病\", \"树脂病\", \"流胶病\",\n    \"脚腐病\", \"煤烟病\", \"砂皮病\"\
          , \"脂点黄斑病\", \"疫病\", \"青霉病\", \"绿霉病\",\n    \"红蜘蛛\", \"蚜虫\", \"潜叶蛾\", \"\
          蚧壳虫\", \"粉虱\", \"蓟马\", \"实蝇\",\n    \"凤蝶\", \"锈壁虱\", \"木虱\", \"天牛\", \"\
          卷叶蛾\", \"蝽\", \"螨\", \"蜗牛\",\n    \"线虫\", \"地老虎\", \"金龟子\", \"象甲\", \"螟\"\
          , \"白粉虱\",\n]\n\nINTENT = [\n    \"怎么处理\", \"如何处理\", \"怎么办\", \"该怎么\", \"\
          怎么治\", \"如何治\",\n    \"怎么防\", \"如何防\", \"防治\", \"防控\", \"用什么药\", \"打什么药\"\
          , \"该打什么\",\n    \"怎么用药\", \"防不住\", \"治不好\", \"有没有药\", \"会不会传染\",\n    #\
          \ \U0001F534 2026-09-28（v74 P0-1）移除「要不要打药」：它问的是\"当前证据下要不要执行用药\"，\n    #\
          \    属于「当前状态+执行决策」，已交给前置路由的 MULTI_DECIDE → 多意图分支（带证据门）。\n    #    留在这里会抢在路由之前把它送进普通防治知识分支，LLM\
          \ 就可能直接说\"可以打药\"。\n    \"特效药\", \"治不住\", \"治不好\", \"打啥子药\", \"打啥药\", \"\
          怎么搞\", \"咋办\",\n    \"能治好\", \"治得好\", \"能不能治\", \"治得住\", \"打点药\", \"喷点药\"\
          , \"用什么药\"\n]\n\n# \U0001F534 执行决策意图：命中则**不**走普通防治知识分支（交给前置路由的多意图+证据门）\n\
          DECIDE = [\n    \"要不要打药\", \"要不要先打\", \"要不要用药\", \"要不要喷药\", \"要不要打一遍\",\
          \ \"要不要马上打\",\n    \"该不该打药\", \"需不需要打药\", \"需不需要用药\", \"用不用打药\", \"打不打药\"\
          , \"要不要打点药\",\n    \"要不要治\", \"该不该治\", \"要不要处理\", \"该不该处理\", \"需不需要处理\"\
          ,\n    \"要不要防\", \"该不该防\", \"要不要喷\", \"能不能打药\", \"可以打药吗\", \"现在要打药吗\", \"\
          需不需要防\",\n]\n\n# \U0001F534 v91 说明见文件末尾追加的 SPEC（分句级识别，替代 v89 整句级）\n\n# 护栏词：出现这些说明问的是\"\
          数据/记录/用药细节\"，交给原分类器，别抢\nGUARD = [\n    \"多久\", \"间隔期\", \"安全间隔\", \"稀释\"\
          , \"多少倍\", \"采果\", \"采摘\", \"几天能\",\n    \"收入\", \"销售\", \"卖\", \"产量\",\
          \ \"多少斤\", \"多少公斤\", \"亩产\", \"记录\", \"几次\",\n]\n\n\ndef _strip_prefix(s:\
          \ str) -> str:\n    \"\"\"问题改写节点有时会带\"改写后：\"\"问句：\"这类前缀，这里清掉。\"\"\"\n  \
          \  import re as _re\n    t = str(s or \"\").strip()\n    t = _re.sub(r\"\
          ^(改写后|改写|问句|独立问句|完整问句)\\s*[:：]\\s*\", \"\", t)\n    return t.strip().strip('\"\
          ').strip(\"\"\"'\"\"\").strip()\n\n\ndef main(query, raw) -> dict:\n   \
          \ q = _strip_prefix(query)\n    r = _strip_prefix(raw)\n    # 病虫名：改写结果优先（能把\"\
          那个\"补成具体病虫），原话兜底\n    pest = next((p for p in PEST if p in q), \"\") or\
          \ next((p for p in PEST if p in r), \"\")\n    # \U0001F534 处置意图只认**用户原话**；改写自己补出来的\"\
          防治\"不算\n    intent = next((i for i in INTENT if i in r), \"\")\n    # 决策意图：先查枚举，再用\"\
          结构识别\"补漏（两者都不受改写影响，只看原话）\n    decide = next((d for d in DECIDE if d in r),\
          \ \"\")\n    if not decide:\n        _sd = _is_decide_text(r)\n        if\
          \ _sd:\n            decide = \"结构:\" + _sd\n    guard = next((g for g in\
          \ GUARD if g in q), \"\") or next((g for g in GUARD if g in r), \"\")\n\
          \    hit = \"yes\" if (pest and intent and not guard and not decide) else\
          \ \"no\"\n    return {\n        \"hit\": hit,\n        \"matched\": \"病虫名=%s\
          \ / 意图(原话)=%s / 决策意图=%s / 护栏=%s\" % (\n            pest or \"-\", intent\
          \ or \"-\", decide or \"-\", guard or \"-\"),\n    }\n\n\n# ============================================================================\n\
          # \U0001F534 v92（v91 同分句补测 · 任务单）：**两线判据**，修\"同分句知识词屏蔽执行决策\"。\n#   v91 的问题：分句内只要出现\"\
          特征/识别/怎么\"等知识词就一票否决 ——\n#   「红蜘蛛有哪些特征以及现在能否施药？」这类**同分句混合意图**会被整体屏蔽（实测 A04/A05/A07\
          \ 失败）。\n#   v92 判据（逐分句）：\n#     ① 强决策信号：_A（明确决策词）+ _V（执行动作）→ **判为执行决策，不看知识词**\n\
          #        （任务单 §六.2：同分句兼有知识标记与明确执行问法时，优先识别执行决策）；\n#     ② 弱决策信号：_B（可以/能/需要/该/要）+\
          \ _V，且（含 _T 当前时间语 或 不含 _FRAME 知识框架语）→ 判为执行决策；\n#     ③ 其余 → 知识/一般问题，保持原路径。\n\
          #   边界（实测）：\n#     ·「红蜘蛛现在暂时不要打药，对吗？」→ ②（要+打药+现在）✓ 判决策；\n#     ·「红蜘蛛什么时候需要防治？」→\
          \ ② 无当前时间语且有\"什么时候\"框架语 → **不判决策** ✓；\n#     ·「如果以后发现红蜘蛛，一般该怎么防治？」→ ② 有\"\
          如果/以后/一般/怎么\" → 不判决策 ✓；\n#     · 纯知识「红蜘蛛怎么防治／用什么药／有哪些措施／发生规律／安全间隔期」→ ① ②\
          \ 都不命中 → 不判决策 ✓。\n#   ⚠️ 只改识别覆盖面，**不动**任何阈值/窗口/门槛/失败关闭规则。\n# ============================================================================\n\
          _A_WORDS = (\"要不要|该不该|需不需要|用不用|打不打|能不能|能否|是否|适不适合|适合\"\n            \"|可不可以|可以不可以|是否可以\"\
          )\n_B_WORDS = \"可以|能|需要|该|要\"\n_V_WORDS = \"防治|防控|用药|施药|打药|喷药|喷施|喷雾|打一遍|喷一遍|处理|治|防|打\"\
          \n_T_WORDS = \"现在|今天|当前|马上|立刻|直接|先\"\n_FRAME_WORDS = (\"怎么|如何|哪些|哪种|有什么|什么|介绍|讲讲|发生规律|危害|特征|症状|识别|区别\"\
          \n                \"|多久|间隔期|安全间隔|稀释|倍数|什么时候|何时|以后|未来|一般|通常|如果|假如|为什么\")\n\
          _A_RE = _re.compile(r\"(%s)[^。？！；;，,\\n]{0,6}(%s)\" % (_A_WORDS, _V_WORDS))\n\
          _B_RE = _re.compile(r\"(%s)[^。？！；;，,\\n]{0,6}(%s)\" % (_B_WORDS, _V_WORDS))\n\
          _T_RE = _re.compile(_T_WORDS)\n_FRAME_RE = _re.compile(_FRAME_WORDS)\n\n\
          \ndef _is_decide_text(s) -> str:\n    \"\"\"分句级两线判据：返回命中的分句（空串 = 不是执行决策）。\"\
          \"\"\n    for _c in _re.split(r\"[。？！；;，,\\n]\", str(s or \"\")):\n    \
          \    _c = _c.strip()\n        if not _c:\n            continue\n       \
          \ if _A_RE.search(_c):                      # ① 强信号：不看知识词\n            return\
          \ _c\n        if _B_RE.search(_c):                      # ② 弱信号：需当前时间语，或无知识框架语\n\
          \            if _T_RE.search(_c) or not _FRAME_RE.search(_c):\n        \
          \        return _c\n    return \"\"\n"
