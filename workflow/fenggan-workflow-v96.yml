        code: "# -*- coding: utf-8 -*-\n\"\"\"算安全间隔：把用药记录里每次施药的日期 + 间隔期，按今天硬算成\n \
          \  「已过 N 天 / 还差 N 天 / 未达到|已达到」，交给 LLM 照抄。\n   \U0001F534 禁止 LLM 自己算天数（历史事故：9月11日打药、间隔21天、9月27日答成\"\
          超过安全间隔期\"）。\"\"\"\nimport json\nfrom datetime import datetime, timedelta,\
          \ timezone\n\n\ndef main(med_json, dev_json, question=None) -> dict:\n \
          \   # \U0001F534 本轮口径（按“农户问的那个病虫”判断，不是看设备全局有没有数据）\n    #    设备拍到木虱 ≠ 有溃疡病的实时数据；溃疡病只有历史记录\
          \ → 必须点破“记录只说明过去”。\n    rt = \"\"\n    try:\n        jd = json.loads(dev_json)\
