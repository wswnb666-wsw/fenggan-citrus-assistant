          \    s = re.sub(r\"^```[a-zA-Z]*\\s*\", \"\", s)\n    s = re.sub(r\"\\s*```$\"\
          , \"\", s).strip()\n\n    arr = []\n    m = re.search(r\"\\[.*\\]\", s,\
          \ re.S)\n    if m:\n        try:\n            d = json.loads(m.group(0))\n\
          \            if isinstance(d, list):\n                arr = [x for x in\
          \ d if isinstance(x, dict) and str(x.get(\"content\") or \"\").strip()]\n\
