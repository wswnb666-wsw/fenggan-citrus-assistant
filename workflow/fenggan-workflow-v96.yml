    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"算安全间隔：把用药记录里每次施药的日期 + 间隔期，按今天硬算成\n \
          \  「已过 N 天 / 还差 N 天 / 未达到|已达到」，交给 LLM 照抄。\n   \U0001F534 禁止 LLM 自己算天数（历史事故：9月11日打药、间隔21天、9月27日答成\"\
          超过安全间隔期\"）。\"\"\"\nimport json\nfrom datetime import datetime, timedelta,\
          \ timezone\n\n\ndef main(med_json) -> dict:\n    d = None\n    try:\n  \
          \      j = json.loads(med_json) if isinstance(med_json, str) else med_json\n\
          \        d = j.get(\"data\") if isinstance(j, dict) else None\n    except\
          \ Exception:\n        d = None\n    today = (datetime.now(timezone.utc)\
          \ + timedelta(hours=8)).replace(tzinfo=None)\n    if not isinstance(d, dict):\n\
          \        return {\"text\": \"【安全间隔期】这次没取到用药记录，算不出来。只能告诉农户\"\n          \
          \              \"“查不到用药记录，算不出天数”，不许猜。\"}\n\n    lst = [x for x in (d.get(\"\
          list\") or []) if isinstance(x, dict)]\n    lst.sort(key=lambda x: str(x.get(\"\
          workTime\") or \"\"), reverse=True)\n\n    rows = []\n    for x in lst[:6]:\n\
          \        drug = str(x.get(\"pesticideName\") or \"\").strip() or \"未填药名\"\
          \n        pest = str(x.get(\"pestName\") or \"\").strip()\n        who =\
          \ \"（防%s）\" % pest if pest else \"\"\n        raw = str(x.get(\"workTime\"\
          ) or \"\")[:10]\n        try:\n            dt = datetime.strptime(raw, \"\
          %Y-%m-%d\")\n        except Exception:\n            rows.append(\"- %s：施药日期缺失/格式不对\
          \ → 算不出来，只说“记录里日期不全”，不许猜\"\n                        % (drug + who))\n  \
          \          continue\n        try:\n            si = int(float(x.get(\"safetyInterval\"\
          )))\n        except Exception:\n            si = 0\n        if si <= 0:\n\
          \            rows.append(\"- %s 施药 %s%s：记录里没填安全间隔期 → 算不出来，只能说\"\n      \
          \                  \"“以农药标签为准”，不许猜\" % (raw, drug, who))\n            continue\n\
          \        passed = (today.date() - dt.date()).days\n        left = si - passed\n\
          \        if left > 0:\n            verdict = \"❌未达到（还差 %d 天）：不许说“已过 / 已经到了\
          \ / 可以采 / 可以再打”\" % left\n        else:\n            verdict = \"✅已达到（超出\
          \ %d 天）：可以说“已经过了安全间隔期”\" % (-left)\n        rows.append(\"- %s 施药 %s%s：间隔期\
          \ %d 天，已过 %d 天，%s\"\n                    % (raw, drug, who, si, passed,\
          \ verdict))\n\n    if not rows:\n        return {\"text\": \"【安全间隔期】用药记录里没有带日期的施药条目，算不出来。\"\
          \n                        \"只说“记录里没有可用的施药日期”，不许猜。\"}\n\n    head = (\"【安全间隔期（系统已按今天\
          \ %s 算好；下面每个天数都是算出来的，\"\n            \"**直接照说，禁止自己再算一遍**）】\" % today.strftime(\"\
          %Y年%m月%d日\"))\n    tail = (\"【口径】状态“未达到”时，只能回答“还差 N 天、暂时不能采 / 不能再打”；\"\n\
          \            \"只有“已达到”才可以说“已经过了安全间隔期”。条目标了“算不出来”时，\"\n            \"直说算不出来、以农药标签为准。\"\
          )\n    latest = (\"【\U0001F534 最新一次施药（农户**没点名是哪支药**时，必须先说这一条）】\"\n     \
          \         + rows[0] + \"\\n\")\n    return {\"text\": head + \"\\n\" + latest\
          \ + \"\\n\".join(rows) + \"\\n\" + tail}\n"
        code_language: python3
        desc: 按今天硬算安全间隔期：已过/还差/是否达到
