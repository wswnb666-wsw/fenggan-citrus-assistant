    - data:
        code: "import json\nimport re\n\n# 把档案里的地块/品种整理成\"已去脏数据 + 数字数准\"的清单（LLM 数数不可靠）\n\
          BAD = re.compile(r\"^\\s*\\d+(\\.\\d+)?\\s*(亩|平方米|平米|公顷|万斤|公斤|吨)\\s*$|回归测试|测试数据|^其他$|^未知$\"\
          )\n\n\ndef main(mem_body) -> dict:\n    prof = {}\n    try:\n        d =\
          \ json.loads(str(mem_body))\n        prof = ((d.get(\"data\") or {}).get(\"\
          profile\") or {}) if isinstance(d, dict) else {}\n    except Exception:\n\
          \        prof = {}\n    plots = [str(p).strip() for p in (prof.get(\"plots\"\
          ) or []) if str(p).strip()]\n    crops = [str(c).strip() for c in (prof.get(\"\
          cropTypes\") or []) if str(c).strip()]\n    plots = [p for p in plots if\
          \ not BAD.search(p)]\n    crops = [c for c in crops if not BAD.search(c)]\n\
          \    return {\n        \"plots_text\": \"共 %d 个地块：%s\" % (len(plots), \"\
          、\".join(plots)) if plots else \"（档案里没有地块记录）\",\n        \"crop_text\":\
          \ \"共 %d 个品种：%s\" % (len(crops), \"、\".join(crops)) if crops else \"（档案里没有品种记录）\"\
          ,\n        \"plots_count\": str(len(plots)),\n        \"crops_count\": str(len(crops)),\n\
          \    }\n"
        code_language: python3
        desc: 解析档案 JSON → 去脏数据 + 由代码数准，供 LLM 直接照抄
        outputs:
          crop_text:
            children: null
            type: string
          crops_count:
            children: null
            type: string
          plots_count:
            children: null
            type: string
          plots_text:
            children: null
            type: string
        selected: false
        title: 整理地块与品种
        type: code
        variables:
        - value_selector:
          - '1790021800001'
          - body
          variable: mem_body
