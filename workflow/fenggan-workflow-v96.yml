          \ and not _safe_cond):\n                        continue\n             \
          \       # \U0001F534 v80 P1-1：正向执行动作 → 删；**该子句内**的否定/事实/条件句 → 保留\n     \
          \               if _EXEC.search(_c) and not _SAFE.search(_c):\n        \
          \                continue\n                    if _INSPECT.search(_c):\n\
          \                        _ctx_inspect = True\n                    _kept.append(_c)\n\
          \                if not _kept:\n                    continue\n         \
          \       # \U0001F534 v86 P1-4：剩下的若只是让步从句（\"虽然没有实时虫量。\"），整段丢弃，不留残句\n    \
          \            if len(_kept) == 1 and _CONCESS.match(_kept[0].strip()):\n\
          \                    continue\n                _j = \"\".join(_kept).rstrip()\n\
          \                while _j and _j[-1] in \"，,、；; \":\n                  \
          \  _j = _j[:-1]\n                if _j and _s.rstrip().endswith((\"。\",\
          \ \"！\", \"？\")) and not _j.endswith((\"。\", \"！\", \"？\")):\n         \
          \           _j += \"。\"\n                if _j:\n                    _keep.append(_j)\n\
          \            t = (gs + \"\\n\" + \"\".join(_keep)).strip()\n    t = t.strip()\n\
          \    return {\"text\": t, \"changed\": \"1\" if t != raw.strip() else \"\
          0\",\n            \"empty\": \"1\" if is_empty else \"0\"}\n"
